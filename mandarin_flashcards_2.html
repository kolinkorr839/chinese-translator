<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandarin Flashcards - Recall Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Crimson+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Crimson Pro', 'PingFang TC', 'Noto Sans TC', Georgia, serif;
    background: #F5F0E8;
    background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    user-select: none;
  }

  .container {
    max-width: 700px;
    width: 100%;
    text-align: center;
  }

  .progress-label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14px;
    font-weight: 600;
    color: #B8860B;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
  }

  .lesson-selector {
    margin-bottom: 16px;
  }
  .selector-row {
    display: flex;
    gap: 6px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }
  .range-input {
    background: #FFFDF8;
    border: 1px solid #E8E0D4;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    color: #1a1a2e;
    width: 130px;
    text-align: center;
    font-family: 'Crimson Pro', Georgia, serif;
  }
  .range-input::placeholder { color: #C4B9A8; }
  .range-input:focus {
    outline: none;
    border-color: #C41E3A;
  }
  .sel-btn {
    background: #FFFDF8;
    border: 1px solid #E8E0D4;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 500;
    color: #1a1a2e;
    cursor: pointer;
    font-family: 'Crimson Pro', Georgia, serif;
    transition: background 0.2s, border-color 0.2s;
  }
  .sel-btn:hover {
    background: #F5F0E8;
    border-color: #C41E3A;
  }
  .sel-btn.active {
    background: #C41E3A;
    color: #fff;
    border-color: #C41E3A;
  }
  .lesson-picker {
    display: none;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    margin-top: 8px;
    padding: 8px 10px;
    background: #FFFDF8;
    border-radius: 8px;
    border: 1px solid #E8E0D4;
    box-shadow: 0 2px 12px rgba(139, 115, 72, 0.08);
  }
  .lesson-cb {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 5px 8px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    color: #6B7B8D;
    transition: background 0.15s, color 0.15s;
  }
  .lesson-cb:hover { background: #F5F0E8; }
  .lesson-cb input { accent-color: #C41E3A; }
  .lesson-cb.checked {
    color: #1a1a2e;
    background: #F5F0E8;
  }

  .prompt-area {
    min-height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }

  .english {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 32px;
    font-weight: 600;
    color: #1a1a2e;
    line-height: 1.3;
  }

  .pinyin {
    font-size: 20px;
    color: #7D8471;
    margin-top: 4px;
    cursor: pointer;
    transition: color 0.15s;
  }

  .pinyin:hover {
    color: #5C6352;
  }

  .answer-area {
    min-height: 120px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 24px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.4s, transform 0.4s;
  }

  .answer-area.revealed {
    opacity: 1;
    transform: translateY(0);
    cursor: pointer;
  }

  .char-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .char-label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 11px;
    font-weight: 600;
    color: #B8860B;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .char {
    font-size: 64px;
    line-height: 1.2;
    color: #1a1a2e;
    white-space: nowrap;
  }

  .divider {
    font-size: 36px;
    color: #E8E0D4;
    font-weight: 300;
    align-self: center;
    margin-top: 16px;
  }

  .divider.same { display: none; }

  .char-block.trad-block.same { display: none; }

  .show-btn {
    background: #FFFDF8;
    border: 1px solid #E8E0D4;
    border-radius: 10px;
    padding: 10px 28px;
    font-size: 15px;
    font-weight: 500;
    color: #B8860B;
    cursor: pointer;
    font-family: 'Crimson Pro', Georgia, serif;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    box-shadow: 0 1px 4px rgba(139, 115, 72, 0.06);
    display: none;
    margin-top: 24px;
  }

  .show-btn:hover {
    background: #F5F0E8;
    border-color: #C41E3A;
    color: #C41E3A;
  }

  .controls {
    margin-top: 32px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    background: #FFFDF8;
    border: 1px solid #E8E0D4;
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 14px;
    font-weight: 500;
    color: #1a1a2e;
    cursor: pointer;
    font-family: 'Crimson Pro', Georgia, serif;
    transition: background 0.2s, border-color 0.2s;
    box-shadow: 0 1px 4px rgba(139, 115, 72, 0.06);
  }

  .btn:hover {
    background: #F5F0E8;
    border-color: #C41E3A;
  }

  .btn.active {
    background: #C41E3A;
    color: #fff;
    border-color: #C41E3A;
  }

  @media (max-width: 520px) {
    .english { font-size: 24px; }
    .pinyin { font-size: 17px; }
    .char { font-size: 48px; }
    .range-input { width: 110px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1 style="font-family:'Cormorant Garamond',serif; font-size:2rem; font-weight:700; color:#C41E3A; text-align:center; margin-bottom:4px; letter-spacing:0.02em;">Recall Mode</h1>
  <p style="text-align:center; color:#8B7D6B; font-size:0.95rem; font-family:'Crimson Pro',serif; font-weight:400; letter-spacing:0.04em; margin-bottom:16px;">English prompt - recall the Chinese</p>
  <div class="progress-label" id="progress"></div>
  <div class="lesson-selector" id="lesson-selector">
    <div class="selector-row">
      <button class="sel-btn active" id="btn-all" onclick="selectAll()">All</button>
      <input type="text" class="range-input" id="range-input"
             placeholder="e.g. 2-4 or 1,3,5"
             onkeydown="if(event.key==='Enter') applyRange()">
      <button class="sel-btn" id="btn-apply" onclick="applyRange()">Go</button>
      <button class="sel-btn" id="btn-pick" onclick="toggleLessonPicker()">Lessons...</button>
    </div>
    <div class="lesson-picker" id="lesson-picker"></div>
  </div>
  <div class="prompt-area">
    <div class="english" id="english"></div>
    <div class="pinyin" id="pinyin" onclick="speak(ALL_PHRASES[order[idx]].simp)"></div>
  </div>
  <div class="answer-area" id="answer-area">
    <div class="char-block">
      <div class="char-label">Simplified</div>
      <div class="char" id="simp-char"></div>
    </div>
    <div class="divider" id="divider">|</div>
    <div class="char-block trad-block" id="trad-block">
      <div class="char-label">Traditional</div>
      <div class="char" id="trad-char"></div>
    </div>
  </div>
  <button class="show-btn" id="btn-show" onclick="revealAnswer()">Show</button>
  <div class="controls">
    <button class="btn active" id="btn-pause" onclick="togglePause()">Resume</button>
    <button class="btn" id="btn-prev" onclick="goBack()">&larr; Prev</button>
    <button class="btn" id="btn-next" onclick="goNext()">Next &rarr;</button>
    <button class="btn" id="btn-shuffle" onclick="toggleShuffle()">Shuffle: On</button>
    <button class="btn" id="btn-speed" onclick="cycleSpeed()">Speed: 1&times;</button>
    <button class="btn" id="btn-sound" onclick="toggleSound()">Sound: On</button>
  </div>
</div>

<script>
const DATA = [{"title": "Lesson 1: Greetings & Basics", "sections": [{"title": "Essential Phrases", "phrases": [{"trad": "你好", "simp": "你好", "pinyin": "nǐ hǎo", "meaning": "Hello"}, {"trad": "您好", "simp": "您好", "pinyin": "nín hǎo", "meaning": "Hello (polite, for elders or strangers)"}, {"trad": "早上好", "simp": "早上好", "pinyin": "zǎoshang hǎo", "meaning": "Good morning"}, {"trad": "晚上好", "simp": "晚上好", "pinyin": "wǎnshang hǎo", "meaning": "Good evening"}, {"trad": "謝謝", "simp": "谢谢", "pinyin": "xièxie", "meaning": "Thank you"}, {"trad": "不客氣", "simp": "不客气", "pinyin": "bú kèqi", "meaning": "You're welcome"}, {"trad": "對不起", "simp": "对不起", "pinyin": "duìbuqǐ", "meaning": "Sorry / Excuse me (apology)"}, {"trad": "沒關係", "simp": "没关系", "pinyin": "méi guānxi", "meaning": "It's OK / No problem"}, {"trad": "請", "simp": "请", "pinyin": "qǐng", "meaning": "Please"}, {"trad": "是", "simp": "是", "pinyin": "shì", "meaning": "Yes / Is / Am / Are"}, {"trad": "不是", "simp": "不是", "pinyin": "bú shì", "meaning": "No / Is not"}, {"trad": "對", "simp": "对", "pinyin": "duì", "meaning": "Correct / Right"}, {"trad": "再見", "simp": "再见", "pinyin": "zàijiàn", "meaning": "Goodbye"}, {"trad": "拜拜", "simp": "拜拜", "pinyin": "báibái", "meaning": "Bye-bye (casual)"}]}]}, {"title": "Lesson 2: Introducing Yourself", "sections": [{"title": "Essential Phrases", "phrases": [{"trad": "我叫...", "simp": "我叫...", "pinyin": "wǒ jiào...", "meaning": "My name is... (I am called...)"}, {"trad": "你叫什麼名字？", "simp": "你叫什么名字？", "pinyin": "nǐ jiào shénme míngzi?", "meaning": "What is your name?"}, {"trad": "您貴姓？", "simp": "您贵姓？", "pinyin": "nín guì xìng?", "meaning": "What is your surname? (very polite)"}, {"trad": "我姓...", "simp": "我姓...", "pinyin": "wǒ xìng...", "meaning": "My surname is..."}, {"trad": "我是美國人", "simp": "我是美国人", "pinyin": "wǒ shì měiguórén", "meaning": "I am American"}, {"trad": "你是哪國人？", "simp": "你是哪国人？", "pinyin": "nǐ shì nǎ guó rén?", "meaning": "What country are you from?"}, {"trad": "認識你很高興", "simp": "认识你很高兴", "pinyin": "rènshi nǐ hěn gāoxìng", "meaning": "Nice to meet you"}, {"trad": "我不會說中文", "simp": "我不会说中文", "pinyin": "wǒ bú huì shuō zhōngwén", "meaning": "I can't speak Chinese"}, {"trad": "我會說一點點", "simp": "我会说一点点", "pinyin": "wǒ huì shuō yìdiǎndiǎn", "meaning": "I can speak a tiny bit"}, {"trad": "你會說英文嗎？", "simp": "你会说英文吗？", "pinyin": "nǐ huì shuō yīngwén ma?", "meaning": "Do you speak English?"}, {"trad": "請再說一遍", "simp": "请再说一遍", "pinyin": "qǐng zài shuō yí biàn", "meaning": "Please say it again"}, {"trad": "慢一點", "simp": "慢一点", "pinyin": "màn yì diǎn", "meaning": "A little slower, please"}]}]}, {"title": "Lesson 3: Numbers & Money", "sections": [{"title": "Numbers 0-10", "phrases": [{"trad": "零", "simp": "零", "pinyin": "líng", "meaning": "0 - zero"}, {"trad": "一", "simp": "一", "pinyin": "yī", "meaning": "1 - one"}, {"trad": "二", "simp": "二", "pinyin": "èr", "meaning": "2 - two"}, {"trad": "三", "simp": "三", "pinyin": "sān", "meaning": "3 - three"}, {"trad": "四", "simp": "四", "pinyin": "sì", "meaning": "4 - four"}, {"trad": "五", "simp": "五", "pinyin": "wǔ", "meaning": "5 - five"}, {"trad": "六", "simp": "六", "pinyin": "liù", "meaning": "6 - six"}, {"trad": "七", "simp": "七", "pinyin": "qī", "meaning": "7 - seven"}, {"trad": "八", "simp": "八", "pinyin": "bā", "meaning": "8 - eight"}, {"trad": "九", "simp": "九", "pinyin": "jiǔ", "meaning": "9 - nine"}, {"trad": "十", "simp": "十", "pinyin": "shí", "meaning": "10 - ten"}]}, {"title": "Money Phrases", "phrases": [{"trad": "多少錢？", "simp": "多少钱？", "pinyin": "duōshao qián?", "meaning": "How much money? / How much does it cost?"}, {"trad": "...塊", "simp": "...块", "pinyin": "...kuài", "meaning": "...(amount) yuan (colloquial)"}, {"trad": "太貴了", "simp": "太贵了", "pinyin": "tài guì le", "meaning": "Too expensive!"}, {"trad": "便宜一點", "simp": "便宜一点", "pinyin": "piányi yì diǎn", "meaning": "A little cheaper, please"}, {"trad": "可以", "simp": "可以", "pinyin": "kěyǐ", "meaning": "OK / Can / Acceptable"}, {"trad": "我要這個", "simp" let shuffled = true;
let revealed = false;
let timer = null;
let timerStart = 0;
let timerDuration = 0;
let soundOn = true;

// Pacing. These were hard-coded at the call sites, so there was no way to slow
// the drill down; the shared speed factor is remembered across decks.
const REVEAL_MS = 1000;
const ADVANCE_MS = 2000;
const SPEEDS = [0.5, 0.75, 1, 1.5, 2];
const DEFAULT_SPEED_IDX = SPEEDS.indexOf(1);

let speedIdx = (() => {
  try {
    const i = parseInt(localStorage.getItem('mandarin-hub-speed'), 10);
    return Number.isInteger(i) && i >= 0 && i < SPEEDS.length ? i : DEFAULT_SPEED_IDX;
  } catch { return DEFAULT_SPEED_IDX; }
})();

// Higher speed means less time on screen, so divide.
const revealMs = () => Math.round(REVEAL_MS / SPEEDS[speedIdx]);
const advanceMs = () => Math.round(ADVANCE_MS / SPEEDS[speedIdx]);

function updateSpeedBtn() {
  const b = document.getElementById('btn-speed');
  if (b) b.textContent = 'Speed: ' + SPEEDS[speedIdx] + '\u00D7';
}

function cycleSpeed() {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  try { localStorage.setItem('mandarin-hub-speed', String(speedIdx)); } catch {}
  updateSpeedBtn();
}
let selectedLessons = new Set();

let zhVoice = null;

function initVoice() {
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    zhVoice = voices.find(v => v.lang.startsWith('zh-CN'))
      || voices.find(v => v.lang.startsWith('zh'))
      || null;
  };
  pick();
  if (!zhVoice) speechSynthesis.addEventListener('voiceschanged', pick);
}

function speak(chinese) {
  if (!soundOn) return;
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(chinese);
  utt.lang = 'zh-CN';
  utt.rate = 0.8;
  if (zhVoice) utt.voice = zhVoice;
  speechSynthesis.speak(utt);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function buildPool() {
  pool = [];
  if (selectedLessons.size === 0) {
    pool = ALL_PHRASES.map((_, i) => i);
  } else {
    selectedLessons.forEach(li => {
      const r = LESSON_RANGES[li];
      for (let i = r.start; i < r.end; i++) pool.push(i);
    });
  }
}

function buildOrder() {
  order = [...pool];
  if (shuffled) shuffle(order);
}

function resetDeck() {
  buildPool();
  buildOrder();
  idx = 0;
  clearInterval(timer);
  showCard();
}

function showCard() {
  const p = ALL_PHRASES[order[idx]];
  const isDiff = p.simp !== p.trad;

  document.getElementById('english').textContent = p.meaning;
  document.getElementById('pinyin').textContent = p.pinyin;
  document.getElementById('simp-char').textContent = p.simp;
  document.getElementById('trad-char').textContent = p.trad;

  document.getElementById('divider').className = isDiff ? 'divider' : 'divider same';
  document.getElementById('trad-block').className = isDiff ? 'char-block trad-block' : 'char-block trad-block same';

  document.getElementById('answer-area').classList.remove('revealed');
  revealed = false;

  document.getElementById('progress').textContent = `${idx + 1} / ${pool.length}`;

  if (paused) {
    document.getElementById('btn-show').style.display = 'inline-block';
  } else {
    document.getElementById('btn-show').style.display = 'none';
    speak(p.simp);
    startTimer(revealMs(), () => {
      document.getElementById('answer-area').classList.add('revealed');
      revealed = true;
      startTimer(advanceMs(), advance);
    });
  }
}

function startTimer(ms, cb) {
  clearInterval(timer);
  timerStart = Date.now();
  timerDuration = ms;

  timer = setInterval(() => {
    if (paused) return;
    const elapsed = Date.now() - timerStart;
    if (elapsed >= timerDuration) {
      clearInterval(timer);
      cb();
    }
  }, 50);
}

function advance() {
  idx = (idx + 1) % order.length;
  if (idx === 0 && shuffled) shuffle(order);
  showCard();
}

function revealAnswer() {
  document.getElementById('btn-show').style.display = 'none';
  document.getElementById('answer-area').classList.add('revealed');
  revealed = true;
  const p = ALL_PHRASES[order[idx]];
  if (soundOn) speak(p.simp);
}

function togglePause() {
  paused = !paused;
  const btn = document.getElementById('btn-pause');
  btn.textContent = paused ? 'Resume' : 'Pause';
  btn.classList.toggle('active', paused);
  if (paused) {
    clearInterval(timer);
    if (!revealed) {
      document.getElementById('btn-show').style.display = 'inline-block';
    }
  } else {
    document.getElementById('btn-show').style.display = 'none';
    if (!revealed) {
      startTimer(revealMs(), () => {
        document.getElementById('answer-area').classList.add('revealed');
        revealed = true;
        startTimer(advanceMs(), advance);
      });
    } else {
      startTimer(advanceMs(), advance);
    }
  }
}

function goNext() {
  clearInterval(timer);
  advance();
}

function goBack() {
  clearInterval(timer);
  idx = (idx - 1 + order.length) % order.length;
  showCard();
}

function toggleShuffle() {
  shuffled = !shuffled;
  document.getElementById('btn-shuffle').textContent = shuffled ? 'Shuffle: On' : 'Shuffle: Off';
  buildOrder();
  idx = 0;
  clearInterval(timer);
  showCard();
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('btn-sound').textContent = soundOn ? 'Sound: On' : 'Sound: Off';
}

function selectAll() {
  selectedLessons.clear();
  document.getElementById('range-input').value = '';
  updateSelectorUI();
  resetDeck();
}

function applyRange() {
  const input = document.getElementById('range-input').value.trim();
  if (!input) { selectAll(); return; }

  const newSet = new Set();
  input.split(',').forEach(part => {
    part = part.trim();
    const rangeMatch = part.match(/^(\d+)\s*-\s*(\d+)$/);
    if (rangeMatch) {
      const a = parseInt(rangeMatch[1]), b = parseInt(rangeMatch[2]);
      for (let i = Math.min(a, b); i <= Math.max(a, b); i++) {
        if (i >= 1 && i <= DATA.length) newSet.add(i - 1);
      }
    } else {
      const n = parseInt(part);
      if (n >= 1 && n <= DATA.length) newSet.add(n - 1);
    }
  });

  if (newSet.size === 0) { selectAll(); return; }
  if (newSet.size === DATA.length) { selectAll(); return; }
  selectedLessons = newSet;
  updateSelectorUI();
  resetDeck();
}

function toggleLessonPicker() {
  const picker = document.getElementById('lesson-picker');
  const btn = document.getElementById('btn-pick');
  if (picker.style.display === 'none' || picker.style.display === '') {
    picker.style.display = 'flex';
    btn.classList.add('active');
  } else {
    picker.style.display = 'none';
    btn.classList.remove('active');
  }
}

function toggleLesson(li) {
  if (selectedLessons.has(li)) {
    selectedLessons.delete(li);
  } else {
    selectedLessons.add(li);
  }
  if (selectedLessons.size === DATA.length) {
    selectedLessons.clear();
  }
  updateSelectorUI();
  resetDeck();
}

function updateSelectorUI() {
  const isAll = selectedLessons.size === 0;
  document.getElementById('btn-all').classList.toggle('active', isAll);

  for (let i = 0; i < DATA.length; i++) {
    const cb = document.getElementById('cb-' + i);
    if (cb) {
      cb.checked = isAll || selectedLessons.has(i);
      cb.parentElement.classList.toggle('checked', !isAll && selectedLessons.has(i));
    }
  }

  if (!isAll) {
    document.getElementById('range-input').value = formatSelection(selectedLessons);
  } else {
    document.getElementById('range-input').value = '';
  }
}

function formatSelection(set) {
  const sorted = [...set].map(i => i + 1).sort((a, b) => a - b);
  const ranges = [];
  let start = sorted[0], prev = sorted[0];
  for (let i = 1; i <= sorted.length; i++) {
    if (i < sorted.length && sorted[i] === prev + 1) {
      prev = sorted[i];
    } else {
      ranges.push(start === prev ? String(start) : `${start}-${prev}`);
      if (i < sorted.length) { start = sorted[i]; prev = sorted[i]; }
    }
  }
  return ranges.join(', ');
}

function initLessonPicker() {
  const picker = document.getElementById('lesson-picker');
  DATA.forEach((lesson, i) => {
    const label = document.createElement('label');
    label.className = 'lesson-cb';
    label.title = lesson.title;
    label.innerHTML = `<input type="checkbox" id="cb-${i}" onchange="toggleLesson(${i})"> ${i + 1}`;
    picker.appendChild(label);
  });
}

document.addEventListener('keydown', (e) => {
  if (document.activeElement === document.getElementById('range-input')) return;
  if (e.key === ' ') { e.preventDefault(); togglePause(); }
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goBack();
  if (e.key === 's' || e.key === 'S') toggleSound();
  if (e.key === 'Enter' || e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    if (paused && !revealed) revealAnswer();
  }
  if (e.key === 'l' || e.key === 'L') toggleLessonPicker();
});

initLessonPicker();
buildPool();
buildOrder();
initVoice();
updateSpeedBtn();

function startFirstCard() {
  if (startFirstCard.done) return;
  startFirstCard.done = true;
  showCard();
}

const voices = speechSynthesis.getVoices();
if (voices.length > 0) {
  showCard();
} else {
  speechSynthesis.addEventListener('voiceschanged', startFirstCard, { once: true });
  setTimeout(startFirstCard, 1000);
}

// The hub hides pages with display:none, which stops neither timers nor audio.
// Pause ourselves when it tells us we are no longer on screen.
window.addEventListener('message', e => {
  if (e.source !== window.parent) return;
  if (!e.data || e.data.type !== 'mandarin-hub:hidden') return;
  if (!paused) togglePause();
  if (window.speechSynthesis) speechSynthesis.cancel();
});
</script>
</body>
</html>
