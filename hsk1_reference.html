<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --rice-paper: #F5F0E8;
  --card-bg: #FFFDF8;
  --ink: #1a1a2e;
  --vermillion: #C41E3A;
  --sage: #7D8471;
  --ink-wash: #6B7B8D;
  --warm-border: #E8E0D4;
}

body {
  font-family: 'Crimson Pro', 'PingFang TC', 'Noto Sans TC',
    'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', serif;
  background: var(--rice-paper);
  background-image:
    repeating-linear-gradient(
      0deg, transparent, transparent 40px,
      rgba(184, 134, 11, 0.03) 40px,
      rgba(184, 134, 11, 0.03) 41px
    ),
    repeating-linear-gradient(
      90deg, transparent, transparent 40px,
      rgba(184, 134, 11, 0.03) 40px,
      rgba(184, 134, 11, 0.03) 41px
    );
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.6;
}

.container {
  max-width: 100%;
  margin: 0 auto;
  padding: 40px 32px 80px;
}

.page-header {
  text-align: center;
  margin-bottom: 40px;
  padding-bottom: 32px;
  border-bottom: 2px solid var(--warm-border);
  position: relative;
}

.page-header::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 2px;
  background: var(--vermillion);
}

.page-header h1 {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-size: 2rem;
  font-weight: 700;
  color: var(--vermillion);
  letter-spacing: 0.02em;
  margin-bottom: 4px;
}

.page-header .subtitle {
  font-size: 0.95rem;
  color: var(--ink-wash);
  font-weight: 400;
  letter-spacing: 0.04em;
}

.search-bar {
  max-width: 400px;
  margin: 0 auto 24px;
}

.search-input {
  width: 100%;
  padding: 10px 16px;
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1rem;
  color: var(--ink);
  background: var(--card-bg);
  border: 1px solid var(--warm-border);
  border-radius: 8px;
  outline: none;
  transition: border-color 0.2s;
}

.search-input::placeholder { color: #C4B9A8; }

.search-input:focus {
  border-color: var(--vermillion);
}

.match-count {
  text-align: center;
  font-size: 0.85rem;
  color: var(--ink-wash);
  margin-bottom: 16px;
}

.ref-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card-bg);
  border: 1px solid var(--warm-border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(139, 119, 75, 0.06),
              0 1px 3px rgba(26, 26, 46, 0.04);
  margin-bottom: 36px;
}

.ref-table thead th {
  background: #F5EDE0;
  color: #3D2B1F;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 700;
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 12px 14px;
  text-align: left;
  border-bottom: 2px solid var(--vermillion);
}

.ref-table thead th:first-child {
  width: 50px;
  text-align: center;
}

.ref-table tbody td {
  padding: 10px 14px;
  border-bottom: 1px solid rgba(232, 224, 212, 0.7);
  vertical-align: middle;
  font-size: 1rem;
}

.ref-table tbody tr:last-child td {
  border-bottom: none;
}

.num-cell {
  text-align: center;
  color: var(--ink-wash);
  font-size: 0.85rem;
}


.clickable {
  cursor: pointer;
  transition: background 0.15s;
  border-radius: 4px;
}

.clickable:hover {
  background: rgba(196, 30, 58, 0.06);
}

.zh {
  font-size: 1.35rem;
  font-weight: 500;
  color: var(--ink);
}

.trad-col {
  font-size: 1.15rem;
  color: var(--ink);
  opacity: 0.6;
}

.pinyin {
  color: var(--sage);
  font-style: italic;
  font-size: 0.95rem;
  cursor: pointer;
  transition: background 0.15s;
  border-radius: 4px;
}

.pinyin:hover {
  background: rgba(125, 132, 113, 0.1);
}

.eng {
  color: var(--ink-wash);
  font-size: 0.95rem;
}

.page-footer {
  text-align: center;
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid var(--warm-border);
  color: var(--ink-wash);
  font-size: 0.9rem;
}

.page-footer .deco {
  color: var(--vermillion);
  opacity: 0.3;
  font-size: 1.2rem;
  font-family: 'PingFang TC', 'Noto Serif TC', serif;
  letter-spacing: 8px;
  margin-bottom: 8px;
}

.section-row td {
  background: #F5EDE0;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 700;
  font-size: 0.95rem;
  color: #3D2B1F;
  padding: 10px 14px;
  border-bottom: 2px solid var(--vermillion);

.star-cell {
  text-align: center;
  width: 40px;
}

.star-btn {

  border: none;
  font-size: 1.3rem;
  cursor: pointer;

}
.star-btn:hover {

}
.star-btn.active {

}

@media (max-width: 600px) {
  .container { padding: 24px 14px 60px; }
  .page-header h1 { font-size: 1.6rem; }
  .ref-table { font-size: 0.9rem; }

  .zh { font-size: 1.15rem; }
  .trad-col { font-size: 1rem; }

</style>

const matchCount = document.getElementById('match-count');

function getTroubleWords() {
  try { return JSON.parse(localStorage.getItem('hsk1-trouble-words')) || []; }
  catch { return []; }
}

function setTroubleWords(list) {
  try { localStorage.setItem('hsk1-trouble-words', JSON.stringify(list)); } catch {}
}

function isTroubleWord(simp) {
  return getTroubleWords().some(w => w.simp === simp);
}

function toggleTroubleWord(w, btn) {
  let list = getTroubleWords();
  const idx = list.findIndex(x => x.simp === w.simp);
  if (idx >= 0) {
    list.splice(idx, 1);
    btn.classList.remove('active');
    btn.textContent = '☆';
  } else {
    list.push({ simp: w.simp, trad: w.trad, pinyin: w.pinyin, meaning: w.english });
    btn.classList.add('active');
    btn.textContent = '★';
  }
  setTroubleWords(list);
}

function render(filter) {
  const q = (filter || '').toLowerCase();
  tbody.innerHTML = '';
  let count = 0;
  HSK_VOCAB.forEach((w, i) => {
    if (q && w.simp.indexOf(q) < 0 && w.trad.indexOf(q) < 0
        && w.pinyin.toLowerCase().indexOf(q) < 0
        && w.english.toLowerCase().indexOf(q) < 0) return;
    if (!q && i % 15 === 0) {
      const hdr = document.createElement('tr');
      hdr.className = 'section-row';
      hdr.innerHTML = '<td colspan="6">Section ' + (Math.floor(i / 15) + 1) + '</td>';
      tbody.appendChild(hdr);
    }
    count++;
    const tr = document.createElement('tr');
    const saved = isTroubleWord(w.simp);
    tr.innerHTML =
      '<td class="num-cell">' + (i + 1) + '</td>' +
      '<td class="clickable" data-zh="' + w.simp + '"><span class="zh">' + w.simp + '</span></td>' +
      '<td class="trad-col">' + w.trad + '</td>' +
      '<td class="pinyin" data-zh="' + w.simp + '">' + w.pinyin + '</td>' +
      '<td class="eng">' + w.english + '</td>' +
      '<td class="star-cell"><button class="star-btn' + (saved ? ' active' : '') + '" data-idx="' + i + '">' + (saved ? '★' : '☆') + '</button></td>';
    tbody.appendChild(tr);
  });
  if (q) {
    matchCount.textContent = count + ' of 150 words';
  } else {
    matchCount.textContent = '';
  }
  bindClickHandlers();
}

function hasSelection() {
  var sel = window.getSelection();
  return sel && sel.toString().length > 0;
}

function bindClickHandlers() {
  document.querySelectorAll('#vocab-body .clickable').forEach(function(cell) {
    cell.addEventListener('click', function() {
      if (hasSelection()) return;
      var zh = cell.getAttribute('data-zh');
      if (zh) lookupInTranslator(zh);
    });
  });
  document.querySelectorAll('#vocab-body td.pinyin').forEach(function(cell) {
    cell.addEventListener('click', function() {
      if (hasSelection()) return;
      var zh = cell.getAttribute('data-zh');
      if (zh) speak(zh);
    });
  });
  document.querySelectorAll('#vocab-body .star-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var i = parseInt(btn.getAttribute('data-idx'), 10);
      toggleTroubleWord(HSK_VOCAB[i], btn);
    });
  });
}

searchInput.addEventListener('input', function() {
  render(this.value);
});

render('');

let ttsAudio = null;

function speak(chinese) {
  if (!chinese) return;

  if (ttsAudio) { ttsAudio.pause(); ttsAudio.src = ''; }

  const youdao = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(chinese)}&le=zh`;
  const google = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=${encodeURIComponent(chinese)}`;
  const engine = localStorage.getItem('tts_engine')
    || (location.protocol === 'file:' ? 'youdao' : 'google');
  const primary = engine === 'youdao' ? youdao : google;
  const fallback = engine === 'youdao' ? google : youdao;

  const slowdown = (primary === youdao);
  ttsAudio = new Audio(primary);
  if (slowdown) ttsAudio.playbackRate = 0.75;
  ttsAudio.play().catch(() => {
    ttsAudio = new Audio(fallback);
    if (!slowdown) ttsAudio.playbackRate = 0.75;
    ttsAudio.play().catch(err => console.warn('TTS unavailable:', err.name));
  });
}

function lookupInTranslator(query) {
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'mandarin-hub:lookup', query }, '*');
  }
}

let scrollTimer = null;
window.addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    try {
      parent.postMessage({ type: 'mandarin-hub:scroll-report', scrollY: window.scrollY }, '*');
    } catch (e) { /* not in iframe */ }
  }, 150);
}, { passive: true });

window.addEventListener('message', (e) => {
  if (!e.data) return;
  if (e.data.type === 'mandarin-hub:visible' && e.data.scrollY != null) {
    const y = e.data.scrollY;
    setTimeout(() => { requestAnimationFrame(() => { requestAnimationFrame(() => window.scrollTo(0, y)); }); }, 50);
  }
});
</script>
