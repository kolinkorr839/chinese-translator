<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinyin Chart - 1st Tone Drill</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Crimson+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --rice-paper: #F5F0E8;
  --card-bg: #FFFDF8;
  --ink: #1a1a2e;
  --vermillion: #C41E3A;
  --warm-border: #E8E0D4;
  --ink-wash: #6B7B8D;
  --gold: #B8860B;
}

body {
  font-family: 'Crimson Pro', 'PingFang TC', 'Noto Sans TC',
    'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', serif;
  background: var(--rice-paper);
  background-image:
    repeating-linear-gradient(
      0deg, transparent, transparent 40px,
      rgba(184, 134, 11, 0.03) 40px,
      rgba(184, 134, 11, 0.03) 41px
    ),
    repeating-linear-gradient(
      90deg, transparent, transparent 40px,
      rgba(184, 134, 11, 0.03) 40px,
      rgba(184, 134, 11, 0.03) 41px
    );
  color: var(--ink);
  min-height: 100vh;
  padding: 16px;
  user-select: none;
}

.chart-container {
  max-width: 1400px;
  margin: 0 auto;
}

h1 {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-size: 2rem;
  font-weight: 700;
  color: var(--vermillion);
  text-align: center;
  margin: 5px 0 4px;
  letter-spacing: 0.02em;
}

.subtitle {
  text-align: center;
  color: #8B7D6B;
  font-size: 0.95rem;
  font-weight: 400;
  letter-spacing: 0.04em;
  margin-bottom: 12px;
}

#status {
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  color: var(--vermillion);
  margin-bottom: 10px;
  min-height: 32px;
  letter-spacing: 1.5px;
  font-family: 'Cormorant Garamond', serif;
}

.hint {
  text-align: center;
  font-size: 12px;
  color: var(--ink-wash);
  margin-bottom: 12px;
}

.table-wrap {
  overflow-x: auto;
  border-radius: 16px;
  border: 1px solid rgba(43, 43, 43, 0.12);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
  background: var(--card-bg);
}

table {
  border-collapse: collapse;
  width: 100%;
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  line-height: 1.3;
}

th, td {
  padding: 6px 4px;
  text-align: center;
  border-bottom: 1px solid rgba(43, 43, 43, 0.04);
  min-width: 44px;
}

th.col-header {
  background: #E8DFD0;
  color: #4A3F34;
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.5px;
  cursor: pointer;
  padding: 10px 4px;
  transition: background 0.15s;
  border-bottom: 1px solid var(--warm-border);
}
th.col-header:hover { background: #DDD3C2; }

th.corner {
  background: #E8DFD0;
  border-bottom: 1px solid var(--warm-border);
  position: sticky;
  left: 0;
  z-index: 3;
}

th.row-header {
  position: sticky;
  left: 0;
  z-index: 2;
  background: #E8DFD0;
  color: #4A3F34;
  font-weight: 600;
  min-width: 48px;
  border-right: 1px solid var(--warm-border);
  font-size: 15px;
  cursor: pointer;
  transition: background 0.15s;
}
th.row-header:hover { background: #DDD3C2; }

td.valid {
  cursor: pointer;
  font-weight: 500;
  color: var(--ink);
  transition: all 0.15s;
  background: var(--card-bg);
}
td.valid:hover { background: rgba(196, 30, 58, 0.06); }

td.empty {
  color: #e0d8cc;
  font-size: 9px;
  background: var(--card-bg);
}

tr:nth-child(even) td.valid:not(.col-active):not(.row-active):not(.cell-playing),
tr:nth-child(even) td.empty:not(.col-active):not(.row-active) {
  background: #FAF6EE;
}

td.col-active:not(.cell-playing),
td.row-active:not(.cell-playing) {
  background: #D0C4B0 !important;
}

td.cell-playing {
  background: var(--vermillion) !important;
  color: #fff !important;
  font-weight: 700;
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}

th.col-active-header,
th.row-active-header {
  background: #D0C4B0 !important;
  color: var(--vermillion) !important;
  font-weight: 700;
}
</style>
</head>
<body>

<div class="chart-container">
  <h1>Pinyin Chart</h1>
  <p class="subtitle">1st Tone Drill</p>
  <div id="status">Click anywhere to start</div>
  <div class="hint">Space = pause/resume &middot; R = repeat &middot; M = toggle row/column mode &middot; Click = play from here &middot; Shift+click = play once &middot; Click header to jump</div>
  <div class="table-wrap">
    <table id="chart"></table>
  </div>
</div>

<script>
const SPEED_MS = 700;
const VOLUME = 0.1;

const INITIALS = ['','b','p','m','f','d','t','n','l','g','k','h','j','q','x','z','c','s','zh','ch','sh','r'];

const ALL_FINALS = ['a','ai','an','ang','ao','e','ei','en','eng','er','i','ia','ian','iang','iao','ie','in','ing','iong','iu','o','ong','ou','u','ua','uai','uan','uang','ui','un','ueng','uo','ü','üan','üe','ün'];

const VALID = {
  '': ['a','ai','an','ang','ao','e','ei','en','eng','er','i','ia','ian','iang','iao','ie','in','ing','iong','iu','o','ou','u','ua','uai','uan','uang','ui','un','ueng','uo','ü','üan','üe','ün'],
  'b': ['a','ai','an','ang','ao','ei','en','eng','i','ie','ian','iao','in','ing','o','u'],
  'p': ['a','ai','an','ang','ao','ei','en','eng','i','ie','ian','iao','in','ing','o','ou','u'],
  'm': ['a','ai','an','ang','ao','e','ei','en','eng','i','ie','ian','iao','in','ing','iu','o','ou','u'],
  'f': ['a','an','ang','ei','en','eng','o','ou','u'],
  'd': ['a','ai','an','ang','ao','e','ei','eng','i','ia','ie','ian','iao','ing','iu','ong','ou','u','uan','ui','un','uo'],
  't': ['a','ai','an','ang','ao','e','eng','i','ie','ian','iao','ing','ong','ou','u','uan','ui','un','uo'],
  'n': ['a','ai','an','ang','ao','e','ei','en','eng','i','ie','ian','iang','iao','in','ing','iu','ong','u','uan','uo','ü','üe'],
  'l': ['a','ai','an','ang','ao','e','ei','eng','i','ia','ie','ian','iang','iao','in','ing','iu','ong','ou','u','uan','un','uo','ü','üe'],
  'g': ['a','ai','an','ang','ao','e','ei','en','eng','ong','ou','u','ua','uai','uan','uang','ui','un','uo'],
  'k': ['a','ai','an','ang','ao','e','en','eng','ong','ou','u','ua','uai','uan','uang','ui','un','uo'],
  'h': ['a','ai','an','ang','ao','e','ei','en','eng','ong','ou','u','ua','uai','uan','uang','ui','un','uo'],
  'j': ['i','ia','ian','iang','iao','ie','in','ing','iong','iu','ü','üan','üe','ün'],
  'q': ['i','ia','ian','iang','iao','ie','in','ing','iong','iu','ü','üan','üe','ün'],
  'x': ['i','ia','ian','iang','iao','ie','in','ing','iong','iu','ü','üan','üe','ün'],
  'z': ['a','ai','an','ang','ao','e','ei','en','eng','i','ong','ou','u','uan','ui','un','uo'],
  'c': ['a','ai','an','ang','ao','e','en','eng','i','ong','ou','u','uan','ui','un','uo'],
  's': ['a','ai','an','ang','ao','e','en','eng','i','ong','ou','u','uan','ui','un','uo'],
  'zh': ['a','ai','an','ang','ao','e','ei','en','eng','i','ong','ou','u','ua','uai','uan','uang','ui','un','uo'],
  'ch': ['a','ai','an','ang','ao','e','en','eng','i','ong','ou','u','uai','uan','uang','ui','un','uo'],
  'sh': ['a','ai','an','ang','ao','e','ei','en','eng','i','ou','u','ua','uai','uan','uang','ui','un','uo'],
  'r': ['an','ang','ao','e','en','eng','i','ong','ou','u','uan','ui','un','uo'],
};

function buildPinyin(initial, final) {
  if (initial === '') {
    const map = {
      'i':'yi','ia':'ya','ie':'ye','iao':'yao','iu':'you',
      'ian':'yan','in':'yin','iang':'yang','ing':'ying','iong':'yong',
      'u':'wu','ua':'wa','uo':'wo','uai':'wai','ui':'wei',
      'uan':'wan','un':'wen','uang':'wang','ueng':'weng',
      'ü':'yu','üe':'yue','üan':'yuan','ün':'yun'
    };
    return map[final] || final;
  }
  if ('jqx'.includes(initial) && final.startsWith('ü')) {
    return initial + final.replace('ü', 'u');
  }
  return initial + final;
}

function addTone1(py) {
  const t = {a:'ā',e:'ē',i:'ī',o:'ō',u:'ū',ü:'ǖ'};
  for (let i = 0; i < py.length; i++) {
    if (py[i] === 'a') return py.slice(0,i) + 'ā' + py.slice(i+1);
    if (py[i] === 'e') return py.slice(0,i) + 'ē' + py.slice(i+1);
  }
  const oi = py.indexOf('ou');
  if (oi >= 0) return py.slice(0,oi) + 'ō' + py.slice(oi+1);
  let last = -1;
  for (let i = 0; i < py.length; i++) {
    if ('iouü'.includes(py[i])) last = i;
  }
  if (last >= 0) return py.slice(0,last) + (t[py[last]]||py[last]) + py.slice(last+1);
  return py;
}

const columnData = INITIALS.map((init, ci) => {
  const vf = VALID[init] || [];
  const cells = [];
  ALL_FINALS.forEach((fin, ri) => {
    if (vf.includes(fin)) {
      const base = buildPinyin(init, fin);
      cells.push({ ri, pinyin: addTone1(base), base });
    }
  });
  return { ci, initial: init, cells };
});

const rowData = ALL_FINALS.map((fin, ri) => {
  const cells = [];
  INITIALS.forEach((init, ci) => {
    const vf = VALID[init] || [];
    if (vf.includes(fin)) {
      const base = buildPinyin(init, fin);
      cells.push({ ci, pinyin: addTone1(base), base });
    }
  });
  return { ri, final: fin, cells };
});

function buildTable() {
  const table = document.getElementById('chart');
  const colCount = INITIALS.length + 1;

  let html = '<thead><tr><th class="corner"></th>';
  INITIALS.forEach((init, ci) => {
    html += '<th class="col-header" id="h-' + ci + '" onclick="jumpToColumn(' + ci + ')">' + (init || '∅') + '</th>';
  });
  html += '</tr></thead><tbody>';

  ALL_FINALS.forEach((fin, ri) => {
    html += '<tr><th class="row-header" id="rh-' + ri + '" onclick="jumpToRow(' + ri + ')">' + fin + '</th>';
    INITIALS.forEach((init, ci) => {
      const vf = VALID[init] || [];
      if (vf.includes(fin)) {
        const base = buildPinyin(init, fin);
        const py = addTone1(base);
        html += '<td class="valid" id="c-' + ci + '-' + ri + '" data-py="' + py + '" data-base="' + base + '" onclick="clickCell(this,event)">' + py + '</td>';
      } else {
        html += '<td class="empty" id="c-' + ci + '-' + ri + '">·</td>';
      }
    });
    html += '</tr>';
  });

  html += '</tbody>';
  table.innerHTML = html;
}

let zhVoice = null;
let currentAudio = null;

function initVoice() {
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    zhVoice = voices.find(v => v.lang.startsWith('zh-CN'))
      || voices.find(v => v.lang.startsWith('zh'))
      || null;
  };
  pick();
  if (!zhVoice) speechSynthesis.addEventListener('voiceschanged', pick);
}

function speakFallback(text) {
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'zh-CN';
  utt.rate = 0.8;
  if (zhVoice) utt.voice = zhVoice;
  speechSynthesis.speak(utt);
}

function buildAudioUrls(basePinyin) {
  const vSlug = basePinyin.replace(/ü/g, 'v');
  const uSlug = basePinyin.replace(/ü/g, 'u');
  const urls = [
    'https://cdn.yoyochinese.com/audio/pychart/' + vSlug + '1.mp3',
  ];
  if (uSlug !== vSlug)
    urls.push('https://cdn.yoyochinese.com/audio/pychart/' + uSlug + '1.mp3');
  urls.push('https://zhongchinese.com/audio/zhuyin/tones/M_' + vSlug + '.mp3');
  return urls;
}

function speak(displayPinyin, basePinyin) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  speechSynthesis.cancel();
  const urls = buildAudioUrls(basePinyin);
  let i = 0;
  function tryNext() {
    if (i >= urls.length) { speakFallback(displayPinyin); return; }
    const audio = new Audio(urls[i]);
    audio.volume = VOLUME;
    currentAudio = audio;
    i++;
    audio.play().catch(tryNext);
  }
  tryNext();
}

let drillMode = 'column';
let colIdx = 0;
let cellIdx = 0;
let rowIdx = 0;
let rowCellIdx = 0;
let playing = false;
let paused = false;
let playTimer = null;
let repeatAxis = false;

function clearHighlights() {
  document.querySelectorAll('.col-active,.row-active').forEach(el => { el.classList.remove('col-active'); el.classList.remove('row-active'); });
  document.querySelectorAll('.cell-playing').forEach(el => el.classList.remove('cell-playing'));
  document.querySelectorAll('.col-active-header,.row-active-header').forEach(el => { el.classList.remove('col-active-header'); el.classList.remove('row-active-header'); });
}

function highlightColumn(ci) {
  const h = document.getElementById('h-' + ci);
  if (h) h.classList.add('col-active-header');
  ALL_FINALS.forEach((_, ri) => {
    const cell = document.getElementById('c-' + ci + '-' + ri);
    if (cell && !cell.classList.contains('empty')) cell.classList.add('col-active');
  });
}

function highlightRow(ri) {
  const rh = document.getElementById('rh-' + ri);
  if (rh) rh.classList.add('row-active-header');
  INITIALS.forEach((_, ci) => {
    const cell = document.getElementById('c-' + ci + '-' + ri);
    if (cell && !cell.classList.contains('empty')) cell.classList.add('row-active');
  });
}

function modeLabel() {
  return drillMode === 'row' ? 'row' : 'col';
}

function statusSuffix() {
  let s = '';
  if (repeatAxis) s += ' (repeat ' + modeLabel() + ')';
  return s;
}

function playNext() {
  if (paused) return;
  if (drillMode === 'row') { playNextRow(); return; }
  playNextColumn();
}

function playNextColumn() {
  clearHighlights();

  const col = columnData[colIdx];
  if (!col || col.cells.length === 0) {
    colIdx = (colIdx + 1) % columnData.length;
    cellIdx = 0;
    playTimer = setTimeout(playNext, 50);
    return;
  }

  highlightColumn(colIdx);

  const cell = col.cells[cellIdx];
  const cellEl = document.getElementById('c-' + colIdx + '-' + cell.ri);
  if (cellEl) {
    cellEl.classList.add('cell-playing');
    cellEl.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  }

  speak(cell.pinyin, cell.base);
  document.getElementById('status').textContent = cell.pinyin + statusSuffix();

  cellIdx++;
  if (cellIdx >= col.cells.length) {
    cellIdx = 0;
    if (!repeatAxis) {
      colIdx = (colIdx + 1) % columnData.length;
    }
  }

  playTimer = setTimeout(playNext, SPEED_MS);
}

function playNextRow() {
  clearHighlights();

  const row = rowData[rowIdx];
  if (!row || row.cells.length === 0) {
    rowIdx = (rowIdx + 1) % rowData.length;
    rowCellIdx = 0;
    playTimer = setTimeout(playNext, 50);
    return;
  }

  highlightRow(rowIdx);

  const cell = row.cells[rowCellIdx];
  const cellEl = document.getElementById('c-' + cell.ci + '-' + rowIdx);
  if (cellEl) {
    cellEl.classList.add('cell-playing');
    cellEl.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  }

  speak(cell.pinyin, cell.base);
  document.getElementById('status').textContent = cell.pinyin + statusSuffix();

  rowCellIdx++;
  if (rowCellIdx >= row.cells.length) {
    rowCellIdx = 0;
    if (!repeatAxis) {
      rowIdx = (rowIdx + 1) % rowData.length;
    }
  }

  playTimer = setTimeout(playNext, SPEED_MS);
}

function start() {
  playing = true;
  paused = false;
  playNext();
}

function togglePause() {
  if (!playing) { start(); return; }
  paused = !paused;
  if (paused) {
    clearTimeout(playTimer);
    const s = document.getElementById('status');
    s.textContent = s.textContent.replace(' (paused)', '') + ' (paused)';
  } else {
    playNext();
  }
}

function jumpToColumn(ci) {
  clearTimeout(playTimer);
  clearHighlights();
  drillMode = 'column';
  colIdx = ci;
  cellIdx = 0;
  playing = true;
  paused = false;
  playNext();
}

function jumpToRow(ri) {
  clearTimeout(playTimer);
  clearHighlights();
  drillMode = 'row';
  rowIdx = ri;
  rowCellIdx = 0;
  playing = true;
  paused = false;
  playNext();
}

let soloAudio = null;

function speakSolo(basePinyin) {
  if (soloAudio) { soloAudio.pause(); soloAudio = null; }
  const urls = buildAudioUrls(basePinyin);
  let i = 0;
  function tryNext() {
    if (i >= urls.length) { speakFallback(basePinyin); return; }
    const audio = new Audio(urls[i]);
    audio.volume = VOLUME;
    soloAudio = audio;
    i++;
    audio.play().catch(tryNext);
  }
  tryNext();
}

function clickCell(el, event) {
  if (event && event.shiftKey) {
    speakSolo(el.dataset.base);
    el.classList.add('cell-playing');
    setTimeout(() => el.classList.remove('cell-playing'), 600);
    return;
  }
  const parts = el.id.split('-');
  const ci = parseInt(parts[1]);
  const ri = parseInt(parts[2]);
  clearTimeout(playTimer);
  clearHighlights();
  if (drillMode === 'row') {
    rowIdx = ri;
    const row = rowData[ri];
    rowCellIdx = row.cells.findIndex(c => c.ci === ci);
    if (rowCellIdx < 0) rowCellIdx = 0;
  } else {
    colIdx = ci;
    const col = columnData[ci];
    cellIdx = col.cells.findIndex(c => c.ri === ri);
    if (cellIdx < 0) cellIdx = 0;
  }
  playing = true;
  paused = false;
  playNext();
}

document.addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); togglePause(); }
  if (e.key === 'r' || e.key === 'R') {
    repeatAxis = !repeatAxis;
    const s = document.getElementById('status');
    s.textContent = s.textContent.replace(/ \(repeat.*?\)/g, '').replace(' (paused)', '');
    if (repeatAxis) s.textContent += ' (repeat ' + modeLabel() + ')';
    if (paused) s.textContent += ' (paused)';
  }
  if (e.key === 'm' || e.key === 'M') {
    drillMode = drillMode === 'column' ? 'row' : 'column';
    const s = document.getElementById('status');
    s.textContent = 'Mode: ' + drillMode + ' drill';
    if (playing && !paused) {
      clearTimeout(playTimer);
      clearHighlights();
      playTimer = setTimeout(playNext, SPEED_MS);
    }
  }
});

initVoice();
buildTable();
</script>
</body>
</html>
