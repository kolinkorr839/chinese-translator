<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Translator</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Crimson+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.3/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Crimson Pro', 'PingFang TC', 'Noto Sans TC', Georgia, serif;
    background: #F5F0E8;
    background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .container {
    flex: 1;
    min-width: 0;
  }

  .columns {
    display: flex;
    gap: 24px;
    justify-content: center;
    align-items: flex-start;
  }

  .column {
    flex: 1;
    max-width: 260px;
    text-align: center;
  }

  .column-label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14px;
    font-weight: 600;
    color: #B8860B;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }

  .card {
    background: #FFFDF8;
    border-radius: 14px;
    box-shadow: 0 2px 16px rgba(139, 115, 72, 0.1), 0 1px 4px rgba(139, 115, 72, 0.06);
    padding: 24px 16px;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: box-shadow 0.2s;
    border: 1px solid #E8E0D4;
  }

  .card:hover {
    box-shadow: 0 6px 24px rgba(139, 115, 72, 0.15), 0 2px 8px rgba(139, 115, 72, 0.08);
  }

  .card-speak {
    cursor: pointer;
  }

  .card-input {
    cursor: text;
  }

  #english-input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 20px;
    text-align: center;
    background: transparent;
    color: #1a1a2e;
    font-family: 'Crimson Pro', Georgia, serif;
  }

  #english-input::placeholder {
    color: #C4B9A8;
  }

  .chinese-text {
    font-size: 40px;
    line-height: 1.3;
    min-height: 52px;
    color: #1a1a2e;
  }

  .pinyin {
    font-size: 14px;
    color: #7D8471;
    margin-top: 10px;
    min-height: 20px;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: color 0.2s;
  }

  .pinyin:hover {
    color: #5C6352;
  }

  .breakdown {
    margin-top: 40px;
    background: #FFFDF8;
    border-radius: 14px;
    box-shadow: 0 2px 16px rgba(139, 115, 72, 0.1);
    padding: 24px 28px;
    display: none;
    border: 1px solid #E8E0D4;
  }

  .breakdown-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14px;
    font-weight: 600;
    color: #B8860B;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
  }

  .breakdown-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #E8E0D4;
    font-size: 16px;
  }

  .breakdown-item:last-child {
    border-bottom: none;
  }

  .breakdown-char {
    font-size: 28px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .breakdown-arrow {
    color: #B8860B;
    font-size: 20px;
  }

  .breakdown-pinyin {
    color: #1a1a2e;
    font-size: 14px;
    margin-left: 4px;
  }

  .breakdown-meaning {
    color: #6B7B8D;
  }

  .components {
    margin-left: 40px;
    padding: 8px 0 4px;
  }

  .component-item {
    font-size: 14px;
    color: #6B7B8D;
    padding: 4px 0;
  }

  .component-char {
    font-size: 22px;
  }

  .component-arrow {
    color: #B8860B;
  }

  .component-meaning {
    color: #6B7B8D;
  }

  .error-msg {
    text-align: center;
    color: #C41E3A;
    font-size: 14px;
    margin-top: 16px;
    padding: 12px 20px;
    background: rgba(196, 30, 58, 0.06);
    border-radius: 10px;
    display: none;
  }

  .error-msg.visible {
    display: block;
  }

  .loading {
    color: #B8860B;
    font-size: 14px;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* API key bar - only visible when no key saved */
  .api-key-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    /* The bar sits inside .container, which starts to the right of the 200px
       .draw-panel plus the 20px .main-layout gap. Reserving that same 220px on
       the right puts the bar's centre back on the page's centre line, so it
       lines up with the "Translator" heading above it instead of with the
       three cards. Cleared below 700px, where .main-layout stacks and
       .container is already full width. */
    margin-right: 220px;
    margin-bottom: 24px;
    font-size: 13px;
    color: #6B7B8D;
  }

  .api-key-bar:empty {
    display: none;
    margin: 0;
  }

  .api-key-bar input {
    border: 1px solid #E8E0D4;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    font-family: 'Crimson Pro', Georgia, serif;
    width: 320px;
    outline: none;
    transition: border-color 0.2s;
    background: #FFFDF8;
    color: #1a1a2e;
  }

  .api-key-bar input:focus {
    border-color: #C41E3A;
  }

  .api-key-bar button {
    background: #C41E3A;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    font-family: 'Crimson Pro', Georgia, serif;
    cursor: pointer;
    transition: background 0.2s;
  }

  .api-key-bar button:hover {
    background: #a01830;
  }

  /* Etymology section */
  .etymology {
    margin-top: 20px;
    background: #FFFDF8;
    border-radius: 14px;
    box-shadow: 0 2px 16px rgba(139, 115, 72, 0.1);
    padding: 24px 28px;
    display: none;
    border: 1px solid #E8E0D4;
  }

  .etymology-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14px;
    font-weight: 600;
    color: #B8860B;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .etymology-key-link {
    font-size: 11px;
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    color: #C41E3A;
  }

  .etymology-title:hover .etymology-key-link {
    opacity: 1;
  }

  .etymology-char-heading {
    font-size: 24px;
    font-weight: 400;
    color: #1a1a2e;
    margin-top: 20px;
    margin-bottom: 12px;
    padding-top: 16px;
    border-top: 1px solid #E8E0D4;
  }

  .etymology-char-heading:first-of-type {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }

  .etymology-section-heading {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 12px;
    font-weight: 600;
    color: #B8860B;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-top: 16px;
    margin-bottom: 8px;
  }

  .etymology-section-heading:first-child {
    margin-top: 0;
  }

  .etymology-components {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }

  .component-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 14px;
  }

  .component-badge.semantic {
    background: #EDE8DC;
    color: #5C6352;
    border: 1px solid #D5CDBD;
  }

  .component-badge.phonetic {
    background: #E8EAF0;
    color: #4A6278;
    border: 1px solid #CDD3DE;
  }

  .component-badge .badge-char {
    font-size: 22px;
  }

  .component-badge .badge-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    opacity: 0.7;
  }

  .etymology-text {
    font-size: 15px;
    line-height: 1.6;
    color: #1a1a2e;
    margin-bottom: 4px;
  }

  .mnemonic-box {
    background: #FBF6EE;
    border-left: 3px solid #C41E3A;
    border-radius: 0 10px 10px 0;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.5;
    color: #1a1a2e;
    margin-top: 8px;
  }

  .related-words {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .related-word-pill {
    background: #F5F0E8;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 14px;
    color: #1a1a2e;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #E8E0D4;
  }

  .related-word-pill .rw-char {
    font-size: 18px;
  }

  .related-word-pill .rw-pinyin {
    color: #7D8471;
    font-size: 12px;
  }

  .related-word-pill .rw-meaning {
    color: #6B7B8D;
    font-size: 12px;
  }

  .etymology-loading {
    color: #B8860B;
    font-size: 14px;
    animation: pulse 1.5s ease-in-out infinite;
    padding: 12px 0;
  }

  .via-label {
    font-size: 11px;
    font-weight: 400;
    color: #8B7D6B;
    font-style: italic;
    font-family: 'Crimson Pro', Georgia, serif;
  }

  /* Chat box */
  .chat-box {
    margin-top: 24px;
    background: #FFFDF8;
    border-radius: 14px;
    box-shadow: 0 2px 16px rgba(139, 115, 72, 0.1);
    overflow: hidden;
    border: 1px solid #E8E0D4;
  }

  .chat-box.hidden {
    display: none;
  }

  .chat-header {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14px;
    font-weight: 600;
    color: #B8860B;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 16px 20px 0;
  }

  .chat-messages {
    max-height: 300px;
    overflow-y: auto;
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chat-msg {
    max-width: 80%;
    padding: 8px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
  }

  .chat-msg.user {
    align-self: flex-end;
    background: #C41E3A;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .chat-msg.ai {
    align-self: flex-start;
    max-width: 100%;
    background: #F5F0E8;
    color: #1a1a2e;
    border-bottom-left-radius: 4px;
    border: 1px solid #E8E0D4;
  }

  .chat-msg.ai.typing {
    animation: pulse 1.5s ease-in-out infinite;
  }

  .chat-input-bar {
    display: flex;
    gap: 8px;
    padding: 12px 20px 16px;
    border-top: 1px solid #E8E0D4;
  }

  .chat-input-bar input {
    flex: 1;
    border: 1px solid #E8E0D4;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 14px;
    font-family: 'Crimson Pro', Georgia, serif;
    outline: none;
    transition: border-color 0.2s;
    background: #FFFDF8;
    color: #1a1a2e;
  }

  .chat-input-bar input:focus {
    border-color: #C41E3A;
  }

  .chat-input-bar button {
    background: #C41E3A;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 14px;
    font-family: 'Crimson Pro', Georgia, serif;
    cursor: pointer;
    transition: background 0.2s;
  }

  .chat-input-bar button:hover {
    background: #a01830;
  }

  .chat-input-bar button:disabled {
    background: #D5CDBD;
    cursor: default;
  }

  /* Draw panel */
  .main-layout {
    display: flex;
    gap: 20px;
    max-width: 1100px;
    width: 100%;
    align-items: flex-start;
  }

  .draw-panel {
    width: 200px;
    flex-shrink: 0;
  }

  .draw-card {
    background: #FFFDF8;
    border-radius: 14px;
    box-shadow: 0 2px 16px rgba(139, 115, 72, 0.1);
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    border: 1px solid #E8E0D4;
  }

  .draw-canvas-wrapper {
    position: relative;
  }

  #draw-canvas {
    border: 2px solid #E8E0D4;
    border-radius: 12px;
    cursor: crosshair;
    display: block;
    touch-action: none;
    background: #FFFDF8;
  }

  .draw-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    color: #C4B9A8;
    pointer-events: none;
    transition: opacity 0.2s;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
  }

  .draw-candidates {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    min-height: 38px;
    align-items: center;
  }

  .draw-candidates-placeholder {
    font-size: 12px;
    color: #C4B9A8;
  }

  .draw-candidate-btn {
    width: 38px;
    height: 38px;
    border: 1px solid #E8E0D4;
    border-radius: 10px;
    background: #FFFDF8;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    color: #1a1a2e;
  }

  .draw-candidate-btn:hover {
    background: #C41E3A;
    color: #fff;
    border-color: #C41E3A;
  }

  .draw-controls {
    display: flex;
    gap: 8px;
  }

  .draw-controls button {
    font-size: 12px;
    padding: 4px 12px;
    border: 1px solid #E8E0D4;
    border-radius: 8px;
    background: #FFFDF8;
    color: #6B7B8D;
    cursor: pointer;
    font-family: 'Crimson Pro', Georgia, serif;
    transition: all 0.15s;
  }

  .draw-controls button:hover {
    border-color: #C41E3A;
    color: #C41E3A;
  }

  .stroke-char {
    cursor: pointer;
    transition: color 0.15s;
  }

  .stroke-char:hover {
    color: #C41E3A;
  }

  #stroke-order-target {
    width: 176px;
    height: 130px;
    border: 2px solid #E8E0D4;
    border-radius: 12px;
    overflow: hidden;
    background: #FFFDF8;
  }

  /* Input method tabs */
  .input-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 8px;
    width: 100%;
  }

  .input-tab {
    flex: 1;
    padding: 6px 0;
    border: 1px solid #E8E0D4;
    background: #F5F0E8;
    color: #8B7D6B;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .input-tab:first-child {
    border-radius: 8px 0 0 8px;
  }

  .input-tab:last-child {
    border-radius: 0 8px 8px 0;
  }

  .input-tab.active {
    background: #FFFDF8;
    color: #B8860B;
    border-color: #B8860B;
    position: relative;
    z-index: 1;
  }

  .input-tab:hover:not(.active) {
    color: #B8860B;
  }

  /* Pinyin input panel */
  .pinyin-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 176px;
    min-height: 178px;
  }

  .pinyin-input-wrapper {
    width: 176px;
  }

  .pinyin-input-wrapper input {
    width: 100%;
    border: 2px solid #E8E0D4;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 16px;
    font-family: 'Crimson Pro', Georgia, serif;
    outline: none;
    background: #FFFDF8;
    color: #1a1a2e;
    transition: border-color 0.2s;
  }

  .pinyin-input-wrapper input:focus {
    border-color: #B8860B;
  }

  .pinyin-input-wrapper input::placeholder {
    color: #C4B9A8;
    font-size: 14px;
  }

  .pinyin-candidates {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    min-height: 38px;
    align-items: center;
    width: 100%;
  }

  .pinyin-candidate-btn {
    min-width: 38px;
    height: 38px;
    padding: 0 8px;
    border: 1px solid #E8E0D4;
    border-radius: 10px;
    background: #FFFDF8;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    color: #1a1a2e;
    white-space: nowrap;
  }

  .pinyin-candidate-btn:hover {
    background: #C41E3A;
    color: #fff;
    border-color: #C41E3A;
  }

  .pinyin-candidates-placeholder {
    font-size: 12px;
    color: #C4B9A8;
  }

  @media (max-width: 700px) {
    .main-layout { flex-direction: column; }
    .draw-panel { width: 100%; }
    .draw-card { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .columns { flex-direction: column; align-items: center; }
    .column { max-width: 100%; width: 100%; }
    /* .main-layout keeps align-items:flex-start when it stacks, so .container
       does not stretch and everything in it collapses to content width against
       the left edge. Force it full width. */
    .container { width: 100%; }
    #pinyin-tab-content { width: 100%; min-height: 130px; display: flex; align-items: flex-start; }
    .pinyin-panel { min-height: 0; width: 100%; }
    .pinyin-input-wrapper { width: 100%; }
    .api-key-bar { margin-right: 0; }
    .api-key-bar input { width: 200px; }
  }
</style>
</head>
<body>
<div style="width:100%; max-width:1100px;">
<h1 style="font-family:'Cormorant Garamond',serif; font-size:2rem; font-weight:700; color:#C41E3A; text-align:center; margin-bottom:0.3rem; letter-spacing:0.02em;">Translator</h1>
<p style="text-align:center; color:#8B7D6B; font-size:0.95rem; font-family:'Crimson Pro',serif; font-weight:400; letter-spacing:0.04em; margin-bottom:16px;">Type, draw, pinyin, or ask about any word</p>
<div class="main-layout">
  <div class="draw-panel">
    <div class="draw-card">
      <div class="input-tabs">
        <button class="input-tab active" id="tab-draw" onclick="switchInputTab('draw')">Draw</button>
        <button class="input-tab" id="tab-pinyin" onclick="switchInputTab('pinyin')">Pinyin</button>
      </div>
      <div id="draw-tab-content">
        <div class="draw-canvas-wrapper" id="draw-canvas-wrapper">
          <canvas id="draw-canvas" width="176" height="130"></canvas>
          <div class="draw-hint" id="draw-hint">Draw here</div>
        </div>
        <div id="stroke-order-wrapper" style="display:none">
          <div id="stroke-order-target"></div>
        </div>
      </div>
      <div id="pinyin-tab-content" style="display:none">
        <div class="pinyin-panel">
          <div class="pinyin-input-wrapper">
            <input type="text" id="pinyin-input" placeholder="Type pinyin" autocomplete="off" spellcheck="false">
          </div>
          <div class="pinyin-candidates" id="pinyin-candidates">
            <span class="pinyin-candidates-placeholder">candidates appear here</span>
          </div>
        </div>
      </div>
      <div class="draw-candidates" id="draw-candidates">
              </div>
      <div class="draw-controls" id="draw-controls">
        <button onclick="undoDrawStroke()">Undo</button>
        <button onclick="clearDrawCanvas()">Clear</button>
      </div>
      <div class="draw-controls" id="stroke-controls" style="display:none">
        <button onclick="replayStrokeOrder()">Replay</button>
        <button onclick="hideStrokeOrder()">Clear</button>
      </div>
      <div class="draw-controls" id="pinyin-controls" style="display:none">
        <button onclick="clearPinyinInput()">Clear</button>
      </div>
    </div>
  </div>
  <div class="container">
  <div class="api-key-bar" id="lara-key-bar"></div>
  <div class="api-key-bar" id="openrouter-key-bar"></div>
  <div class="api-key-bar" id="api-key-bar"></div>

async function callOpenRouter(messages, jsonMode) {
  const apiKey = getOpenRouterKey();
  if (!apiKey) throw new Error('OpenRouter key not configured');

  const body = { messages };
  for (const model of OPENROUTER_MODELS) {
    body.model = model;
    if (jsonMode) body.response_format = { type: 'json_object' };
    const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify(body)
    });
    if (resp.status === 429 || resp.status === 404) continue;
    if (!resp.ok) throw new Error(`OpenRouter ${resp.status}`);
    const data = await resp.json();
    return data.choices?.[0]?.message?.content || '';
  }
  throw new Error('All OpenRouter models exhausted');
}

function isChinese(text) {
  return /[一-鿿㐀-䶿]/.test(text);

// One translation fans out to ~10 calls to an undocumented endpoint that
// throttles by IP (3 for the translation itself, plus one per character for the
// breakdown). Caching kills most of that: the per-character lookups repeat
// constantly across words, so a warm cache makes them free.
const TRANSLATION_CACHE_KEY = 'translation_cache';
const TRANSLATION_CACHE_MAX = 800;

let translationCache = (() => {
  try { return JSON.parse(localStorage.getItem(TRANSLATION_CACHE_KEY) || '{}'); }
  catch { return {}; }
})();

function persistTranslationCache() {
  try {
    const keys = Object.keys(translationCache);
    // Object keys keep insertion order, so slicing off the front drops oldest.
    if (keys.length > TRANSLATION_CACHE_MAX) {
      for (const k of keys.slice(0, keys.length - TRANSLATION_CACHE_MAX)) {
        delete translationCache[k];
      }
    }
    localStorage.setItem(TRANSLATION_CACHE_KEY, JSON.stringify(translationCache));
  } catch {
    // Quota exceeded or storage disabled -- the in-memory cache still works.
  }
}

function getLaraKeyId() { return localStorage.getItem('lara_key_id') || ''; }
function getLaraKeySecret() { return localStorage.getItem('lara_key_secret') || ''; }
let laraJwt = null;

async function laraDigestBase64(data) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
  return btoa(String.fromCharCode(...new Uint8Array(buf.slice(0, 16))));
}

async function laraHmac(key, data) {
  const enc = new TextEncoder();
  const cryptoKey = await crypto.subtle.importKey(
    'raw', enc.encode(key), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
  );
  const sig = await crypto.subtle.sign('HMAC', cryptoKey, enc.encode(data));
  return btoa(String.fromCharCode(...new Uint8Array(sig)));
}

async function laraAuth() {
  const keyId = getLaraKeyId();
  const keySecret = getLaraKeySecret();
  if (!keyId || !keySecret) throw new Error('Lara credentials not configured');
  const body = JSON.stringify({ id: keyId });
  const contentMd5 = await laraDigestBase64(body);
  const date = new Date().toUTCString();
  const challenge = `POST\n/v2/auth\n${contentMd5}\napplication/json\n${date}`;
  const signature = await laraHmac(keySecret, challenge);

  const resp = await fetch('https://api.laratranslate.com/v2/auth', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Content-MD5': contentMd5,
      'X-Lara-Date': date,
      'Authorization': `Lara:${signature}`
    },
    body
  });
  if (!resp.ok) {
    const text = await resp.text().catch(() => '');
    throw new Error(`Lara auth failed: ${resp.status} ${text}`);
  }
  const data = await resp.json();
  laraJwt = data.token;
  return laraJwt;
}

async function laraTranslate(text, sourceLang, targetLang) {
  if (!laraJwt) await laraAuth();

  const reqBody = { q: text, target: targetLang };
  if (sourceLang && sourceLang !== 'auto') reqBody.source = sourceLang;

  let resp = await fetch('https://api.laratranslate.com/v2/translate', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Lara-Date': new Date().toUTCString(),
      'Authorization': `Bearer ${laraJwt}`
    },
    body: JSON.stringify(reqBody)
  });

  if (resp.status === 401) {
    await laraAuth();
    resp = await fetch('https://api.laratranslate.com/v2/translate', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Lara-Date': new Date().toUTCString(),
        'Authorization': `Bearer ${laraJwt}`
      },
      body: JSON.stringify(reqBody)
    });
  }

  if (!resp.ok) {
    const errText = await resp.text().catch(() => '');
    throw new Error(`Lara translate failed: ${resp.status} ${errText}`);
  }
  const data = await resp.json();
  return data.translation;
}

async function translateText(text, sourceLang, targetLang) {
  const key = `${sourceLang}|${targetLang}|${text}`;
  if (typeof translationCache[key] === 'string') return translationCache[key];

  const useLaraFirst = location.protocol === 'file:';
  const primary = useLaraFirst ? laraTranslate : googleTranslate;
  const fallback = useLaraFirst ? googleTranslate : laraTranslate;
  const primaryName = useLaraFirst ? 'lara' : 'google';
  const fallbackName = useLaraFirst ? 'google' : 'lara';

  let result;
  try {
    result = await primary(text, sourceLang, targetLang);
    lastTranslationSource = primaryName;
  } catch {
    result = await fallback(text, sourceLang, targetLang);
    lastTranslationSource = fallbackName;
  }
  translationCache[key] = result;
  persistTranslationCache();
  return result;
}

async function googleTranslate(text, sourceLang, targetLang) {
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;

  let lastErr;
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      if (attempt) await new Promise(r => setTimeout(r, 700));
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      if (!Array.isArray(data[0])) throw new Error('Unexpected response shape');
      return data[0].map(s => s[0]).join('');
    } catch (err) {
      lastErr = err;
    }
  }
  throw lastErr;
}

function getPinyin(chinese) {
  if (typeof pinyinPro === 'undefined') return '';
  return pinyinPro.pinyin(chinese, { toneType: 'num', type: 'array' }).join(' ');

let ttsAudio = null;

function speak(chinese) {
  if (!chinese) return;

  // Stop whatever is still playing, otherwise rapid clicks stack voices.
  if (ttsAudio) { ttsAudio.pause(); ttsAudio.src = ''; }

  const youdao = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(chinese)}&le=zh`;
  const google = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=${encodeURIComponent(chinese)}`;
  const primary = location.protocol === 'file:' ? youdao : google;
  const fallback = location.protocol === 'file:' ? google : youdao;

  const isFile = location.protocol === 'file:';
  ttsAudio = new Audio(primary);
  if (isFile) ttsAudio.playbackRate = 0.75;
  ttsAudio.play().catch(() => {
    ttsAudio = new Audio(fallback);
    if (!isFile) ttsAudio.playbackRate = 0.75;
    ttsAudio.play().catch(err => console.warn('TTS unavailable:', err.name));
  });
}

  const tradEl = document.getElementById('traditional-text');
  const simpEl = document.getElementById('simplified-text');
  const tradPinEl = document.getElementById('traditional-pinyin');
  const simpPinEl = document.getElementById('simplified-pinyin');

  const breakdownContent = document.getElementById('breakdown-content');

  tradEl.innerHTML = '<span class="loading">...</span>';
  simpEl.innerHTML = '<span class="loading">...</span>';
  tradPinEl.textContent = '';
  simpPinEl.textContent = '';
  const etymologyEl = document.getElementById('etymology');
  const etymologyContent = document.getElementById('etymology-content');

  document.getElementById('error-msg').classList.remove('visible');
  document.getElementById('translation-via').style.display = 'none';

  breakdownEl.style.display = 'none';
  breakdownContent.innerHTML = '';
  etymologyEl.style.display = 'none';
  etymologyContent.innerHTML = '';
  lastTranslationSource = '';
  lastEtymologySource = '';
  document.getElementById('chat-messages').innerHTML = '';
  chatHistory = [];
  currentTranslation = null;

  let rendered = false;

  try {
    let traditional, simplified, english;

    if (isChinese(input)) {
      const asSimplified = await translateText(input, 'zh-TW', 'zh-CN');
      const asTraditional = await translateText(input, 'zh-CN', 'zh-TW');

      if (asSimplified === input || input === asTraditional) {
        traditional = asTraditional === input ? input : asTraditional;
        simplified = asSimplified;
      } else {
        traditional = asTraditional;
        simplified = asSimplified;
      }

      english = await translateText(input, 'auto', 'en');
      document.getElementById('english-input').value = english.toLowerCase();
    } else {
      english = input;
      traditional = await translateText(input, 'en', 'zh-TW');
      simplified = await translateText(traditional, 'zh-TW', 'zh-CN');
    }

    renderClickableChars(tradEl, traditional);
    renderClickableChars(simpEl, simplified);
    // From here the translation is on screen. Anything that fails after this
    // point is enrichment (breakdown, etymology) and must not wipe the result.
    rendered = true;

    const usedFallbackTranslation = (location.protocol === 'file:' && lastTranslationSource === 'google')
      || (location.protocol !== 'file:' && lastTranslationSource === 'lara');
    if (usedFallbackTranslation) {
      const viaEl = document.getElementById('translation-via');
      const label = lastTranslationSource === 'google' ? 'Google Translate' : 'Lara Translate';
      viaEl.textContent = `via ${label}`;
      viaEl.style.display = 'block';
    }

    const tradPinyin = getPinyin(traditional);
    const simpPinyin = getPinyin(simplified);

    tradPinEl.textContent = tradPinyin;
    tradPinEl.onclick = () => speak(traditional);
    simpPinEl.textContent = simpPinyin;
    simpPinEl.onclick = () => speak(simplified);
    document.getElementById('simplified-card').onclick = () => speak(simplified);
    document.getElementById('traditional-card').onclick = () => speak(traditional);

    currentTranslation = { traditional, simplified, english, pinyin: tradPinyin };

    await buildBreakdown(traditional, simplified, breakdownContent);
    breakdownEl.style.display = 'block';

    const hasGeminiKey = !!localStorage.getItem('gemini_api_key');
    const hasORKey = location.protocol === 'file:' && !!getOpenRouterKey();
    if (hasGeminiKey || hasORKey) {
      etymologyEl.style.display = 'block';
      if (location.protocol === 'file:') {
        document.getElementById('clear-etymology-cache').style.display = 'block';
      }
      const loadingMsg = !hasGeminiKey && hasORKey
        ? 'Loading etymology via OpenRouter (this may take a while)...'
        : 'Loading etymology...';
      etymologyContent.innerHTML = `<div class="etymology-loading">${loadingMsg}</div>`;
      const tradChars = [...traditional];
      const simpChars = [...simplified];
      const sameLength = tradChars.length === simpChars.length;
      const allEtymData = [];
      let etymError = false;
      for (let i = 0; i < simpChars.length; i++) {
        const sc = simpChars[i];
        if (!/[一-鿿㐀-䶿]/.test(sc)) continue;
        const tc = sameLength ? tradChars[i] : sc;
        const charMeaning = await getCharMeaning(sc);
        const data = await getEtymology(tc, sc, charMeaning);
        if (data && data._error) {
          renderEtymologyError(data._error);
          etymError = true;
          break;
        }
        if (data) allEtymData.push({ char: sc, data });
      }
      if (allEtymData.length > 0) {
        renderEtymology(allEtymData);
        if (lastEtymologySource === 'openrouter') {
          document.getElementById('etymology-via').textContent = 'via OpenRouter · ';
        }
      } else if (!etymError) {
        etymologyContent.innerHTML = '';
        etymologyEl.style.display = 'none';
      }
    }


  } catch (err) {
    console.error('Translation error:', err);

    // The translation is already showing; only the breakdown or etymology
    // failed. Keep what we have rather than blanking a good result.
    if (rendered) return;

    tradEl.textContent = '';
    simpEl.textContent = '';
    const errorEl = document.getElementById('error-msg');
    if (!navigator.onLine) {
      errorEl.textContent = 'You are offline. Translation requires an internet connection — try Flashcards or Grammar Guide instead.';
    } else {
      errorEl.textContent = 'Translation service unavailable. Try again in a moment.';
    }
    errorEl.classList.add('visible');
  }
}

async function buildBreakdown(traditional, simplified, container) {
  const tradChars = [...traditional];
  const simpChars = [...simplified];
  const sameLength = tradChars.length === simpChars.length;
  const cjkCount = simpChars.filter(c => /[一-鿿㐀-䶿]/.test(c)).length;
  const isSingleChar = cjkCount === 1;

  for (let i = 0; i < simpChars.length; i++) {
    const sc = simpChars[i];
    if (!/[一-鿿㐀-䶿]/.test(sc)) continue;
    const tc = sameLength ? tradChars[i] : sc;
    const pinyin = getPinyin(sc);
    const meaning = await getCharMeaning(sc);
    const isDifferent = tc !== sc;

    const item = document.createElement('div');
    item.className = 'breakdown-item';

    let charDisplay;
    if (isDifferent) {
      charDisplay = `<span class="breakdown-char">${sc} <span class="breakdown-arrow">&rarr;</span> ${tc}</span>`;
    } else {
      charDisplay = `<span class="breakdown-char">${tc}</span>`;
    }

    item.innerHTML = `
      ${charDisplay}
      <span class="breakdown-pinyin">${pinyin}</span>
      <span class="breakdown-meaning">= ${meaning}</span>
    `;
    container.appendChild(item);

    if (isSingleChar && DECOMPOSITION[tc]) {
      const decomp = DECOMPOSITION[tc];
      const compDiv = document.createElement('div');
      compDiv.className = 'components';

      for (const [tradComp, simpComp, compMeaning] of decomp.components) {
        const compItem = document.createElement('div');
        compItem.className = 'component-item';

        if (tradComp !== simpComp) {
          compItem.innerHTML = `
            <span class="component-char">${simpComp}</span>
            <span class="component-arrow">&rarr;</span>
            <span class="component-char">${tradComp}</span>
            <span class="component-meaning">= ${compMeaning}</span>
          `;
        } else {
          compItem.innerHTML = `
            <span class="component-char">${tradComp}</span>
            <span class="component-meaning">= ${compMeaning}</span>
          `;
        }
        compDiv.appendChild(compItem);
      }
      container.appendChild(compDiv);
    }
  }
}

function getEtymologyCache(key) {
  try {
    const cache = JSON.parse(localStorage.getItem('etymology_cache') || '{}');
    return cache[key] || null;
  } catch { return null; }
}

function setEtymologyCache(key, data) {
  try {
    const cache = JSON.parse(localStorage.getItem('etymology_cache') || '{}');
    cache[key] = data;
    localStorage.setItem('etymology_cache', JSON.stringify(cache));
  } catch {}
}

function buildEtymologyPrompt(traditional, simplified, english) {
  const pinyin = getPinyin(simplified);
  return `You are a Chinese etymology expert. Analyze the character ${simplified}${traditional !== simplified ? ' (traditional: ' + traditional + ')' : ''}, pinyin: ${pinyin}, English meaning: "${english}".

IMPORTANT:
- Analyze ONLY the character ${simplified} — break down its actual components. Do not substitute a synonym or related character even if the meaning seems similar.
- The simplified form may have different radicals than the traditional form. Decompose the simplified character as written, not the traditional.
- Write ALL explanations, descriptions, and the mnemonic in English. When citing Chinese characters in the text, use their simplified forms.
- Only use traditional forms in the "traditional" field when they differ from the simplified form.

Return JSON with this exact structure:
{
  "character": "the exact character you analyzed",
  "components": [
    {
      "char": "component in simplified Chinese",
      "traditional": "traditional form if different, otherwise omit",
      "type": "semantic or phonetic",
      "meaning": "English meaning of this component",
      "explanation": "in English, why this component is in this character"
    }
  ],
  "meaning_logic": "in English, how the components combine to create the meaning",
  "historical_context": "in English, cultural/historical/linguistic background",
  "mnemonic": "in English, a vivid memory aid using the visual components",
  "related_words": [
    { "word": "a common word using this character (simplified Chinese)", "pinyin": "pinyin", "meaning": "English meaning" }
  ]
}

Be specific and insightful. For the mnemonic, describe how to "read the drawing" of the character. For related_words, give 3-5 common examples. Keep historical_context to 2-3 sentences.`;
}

async function getEtymologyViaGemini(prompt) {
  const apiKey = localStorage.getItem('gemini_api_key');
  if (!apiKey) return null;

  const { resp, model } = await callGemini(apiKey, {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: {
      response_mime_type: 'application/json',
      temperature: 0.7
    }
  });

  if (!resp.ok) {
    const msg = resp.status === 404 ? `Model ${model} not found` : `API error ${resp.status} (${model})`;
    console.error('Gemini API error:', resp.status, model);
    throw new Error(msg);
  }

  const data = await resp.json();
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) throw new Error('Empty response from Gemini');
  return JSON.parse(text);
}

async function getEtymologyViaOpenRouter(prompt) {
  const text = await callOpenRouter(
    [{ role: 'user', content: prompt + '\n\nRespond with valid JSON only, no markdown.' }],
    true
  );
  const cleaned = text.replace(/^```json?\s*|```\s*$/g, '').trim();
  return JSON.parse(cleaned);
}

async function getEtymology(traditional, simplified, english) {
  const hasGemini = !!localStorage.getItem('gemini_api_key');
  const hasOpenRouter = location.protocol === 'file:' && !!getOpenRouterKey();
  if (!hasGemini && !hasOpenRouter) return null;

  const cached = getEtymologyCache(traditional);
  if (cached) return cached;

  const prompt = buildEtymologyPrompt(traditional, simplified, english);

  function isWrongChar(result) {
    return result.character && result.character !== traditional && result.character !== simplified;
  }

  try {
    const result = hasGemini
      ? await getEtymologyViaGemini(prompt)
      : await getEtymologyViaOpenRouter(prompt);
    lastEtymologySource = hasGemini ? 'gemini' : 'openrouter';
    if (result) {
      if (isWrongChar(result)) return { _error: `Etymology returned for ${result.character} instead of ${traditional}` };
      setEtymologyCache(traditional, result);
      return result;
    }
    return { _error: 'Empty etymology response' };
  } catch (primaryErr) {
    console.warn('Primary etymology failed:', primaryErr.message);
    if (hasOpenRouter && hasGemini) {
      try {
        const result = await getEtymologyViaOpenRouter(prompt);
        lastEtymologySource = 'openrouter';
        if (result) {
          if (isWrongChar(result)) return { _error: `Etymology returned for ${result.character} instead of ${traditional}` };
          setEtymologyCache(traditional, result);
          return result;
        }
        return { _error: 'Empty OpenRouter response' };
      } catch (orErr) {
        console.error('OpenRouter fallback failed:', orErr);
        return { _error: orErr.message || 'Fallback failed' };
      }
    }
    return { _error: primaryErr.message || 'Network error' };
  }
}

function renderEtymologyError(msg) {

function isCJK(str) {
  return /[㐀-鿿豈-﫿]/.test(str);
}

function renderEtymology(entries) {
  const container = document.getElementById('etymology-content');
  const section = document.getElementById('etymology');
  container.innerHTML = '';

  if (!entries || entries.length === 0) {
    section.style.display = 'none';
    return;
  }

  let html = '';
  const multiChar = entries.length > 1;

  for (const entry of entries) {
    const data = entry.data;

    if (multiChar) {
      html += `<div class="etymology-char-heading">${entry.char}</div>`;
    }

    if (data.components && data.components.length > 0) {
      html += '<div class="etymology-section-heading">Components</div>';
      html += '<div class="etymology-components">';
      for (const comp of data.components) {
        const typeClass = comp.type === 'phonetic' ? 'phonetic' : 'semantic';
        const displayChar = isCJK(comp.char) ? comp.char : '';
        html += `<div class="component-badge ${typeClass}">
          ${displayChar ? `<span class="badge-char">${displayChar}</span>` : ''}
          <div>
            <div>${comp.meaning}</div>
            <div class="badge-label">${comp.type}</div>
          </div>
        </div>`;
      }
      html += '</div>';
      if (data.components.some(c => c.explanation)) {
        for (const comp of data.components) {
          if (comp.explanation) {
            const label = isCJK(comp.char) ? comp.char : comp.meaning;
            html += `<div class="etymology-text" style="font-size:13px; color:#6B7B8D; margin-top:4px;">${label} - ${comp.explanation}</div>`;
          }
        }
      }
    }

    if (data.meaning_logic) {
      html += '<div class="etymology-section-heading">How it works</div>';
      html += `<div class="etymology-text">${data.meaning_logic}</div>`;
    }

    if (data.historical_context) {
      html += '<div class="etymology-section-heading">History</div>';
      html += `<div class="etymology-text">${data.historical_context}</div>`;
    }

    if (data.mnemonic) {
      html += '<div class="etymology-section-heading">Memory aid</div>';
      html += `<div class="mnemonic-box">${data.mnemonic}</div>`;
    }

    if (data.related_words && data.related_words.length > 0) {
      html += '<div class="etymology-section-heading">Related words</div>';
      html += '<div class="related-words">';
      for (const rw of data.related_words) {
        html += `<div class="related-word-pill">
          <span class="rw-char">${rw.word}</span>
          <span class="rw-pinyin">${rw.pinyin}</span>
          <span class="rw-meaning">${rw.meaning}</span>
        </div>`;
      }
      html += '</div>';
    }
  }

  container.innerHTML = html;
  section.style.display = 'block';
}

let chatHistory = [];
let currentTranslation = null;

async function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;

  const apiKey = localStorage.getItem('gemini_api_key');
  const hasOpenRouter = location.protocol === 'file:' && !!getOpenRouterKey();
  if (!apiKey && !hasOpenRouter) return;

  input.value = '';
  const messagesEl = document.getElementById('chat-messages');
  const sendBtn = document.getElementById('chat-send');

  messagesEl.innerHTML += `<div class="chat-msg user">${escapeHtml(msg)}</div>`;
  messagesEl.innerHTML += `<div class="chat-msg ai typing" id="chat-typing">...</div>`;
  messagesEl.scrollTop = messagesEl.scrollHeight;
  sendBtn.disabled = true;

  let systemInstruction = 'You are a helpful Chinese language tutor. Answer concisely. Use Chinese characters with pinyin when relevant. Keep answers under 3 paragraphs.';
  if (currentTranslation) {
    const t = currentTranslation;
    systemInstruction = `You are a helpful Chinese language tutor. The user is studying this word/character:
- Traditional: ${t.traditional}
- Simplified: ${t.simplified}
- Pinyin: ${t.pinyin}
- English: ${t.english}

Answer concisely. Use Chinese characters with pinyin when relevant. Keep answers under 3 paragraphs.`;
  }

  chatHistory.push({ role: 'user', parts: [{ text: msg }] });

  let reply;
  let chatUsedOpenRouter = false;
  try {
    if (apiKey) {
      const { resp, model } = await callGemini(apiKey, {
        system_instruction: { parts: [{ text: systemInstruction }] },
        contents: chatHistory,
        generationConfig: { temperature: 0.7 }
      });
      if (!resp.ok) throw new Error(`API error ${resp.status} (${model})`);
      const data = await resp.json();
      reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response';
    } else {
      throw new Error('No Gemini key');
    }
  } catch (geminiErr) {
    if (hasOpenRouter) {
      try {
        const orMessages = [{ role: 'system', content: systemInstruction }];
        for (const entry of chatHistory) {
          orMessages.push({
            role: entry.role === 'model' ? 'assistant' : 'user',
            content: entry.parts[0].text
          });
        }
        reply = await callOpenRouter(orMessages, false);
        chatUsedOpenRouter = true;
      } catch (orErr) {
        const typing = document.getElementById('chat-typing');
        if (typing) {
          typing.classList.remove('typing');
          typing.textContent = `Error: ${orErr.message}`;
        }
        chatHistory.pop();
        sendBtn.disabled = false;
        return;
      }
    } else {
      const typing = document.getElementById('chat-typing');
      if (typing) {
        typing.classList.remove('typing');
        typing.textContent = `Error: ${geminiErr.message}`;
      }
      chatHistory.pop();
      sendBtn.disabled = false;
      return;
    }
  }

  const typing = document.getElementById('chat-typing');
  chatHistory.push({ role: 'model', parts: [{ text: reply }] });
  typing.id = '';
  typing.classList.remove('typing');
  typing.innerHTML = formatChat(reply);
  if (chatUsedOpenRouter) {
    typing.innerHTML += '<div class="via-label" style="text-align:right; margin-top:4px;">via OpenRouter</div>';
  }

  sendBtn.disabled = false;
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function formatChat(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

// Handwriting recognition
const drawCanvas = document.getElementById('draw-canvas');
const drawCtx = drawCanvas.getContext('2d');
const drawHint = document.getElementById('draw-hint');
const drawCandidatesEl = document.getElementById('draw-candidates');

drawCtx.strokeStyle = '#1a1a2e';
drawCtx.lineWidth = 3;
drawCtx.lineCap = 'round';
drawCtx.lineJoin = 'round';

let drawStrokes = [];
let drawCurrentStroke = null;
let drawIsDrawing = false;
let drawRecognizeTimer = null;

function getDrawPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  if (e.touches) {
    return [
      (e.touches[0].clientX - rect.left) * scaleX,
      (e.touches[0].clientY - rect.top) * scaleY
    ];
  }
  return [
    (e.clientX - rect.left) * scaleX,
    (e.clientY - rect.top) * scaleY
  ];
}

function startDrawStroke(e) {
  e.preventDefault();
  drawIsDrawing = true;
  const [x, y] = getDrawPos(e);
  drawCurrentStroke = { xs: [x], ys: [y], ts: [Date.now()] };
  drawCtx.beginPath();
  drawCtx.moveTo(x, y);
  drawHint.style.opacity = '0';
}

function moveDrawStroke(e) {
  if (!drawIsDrawing || !drawCurrentStroke) return;
  e.preventDefault();
  const [x, y] = getDrawPos(e);
  drawCurrentStroke.xs.push(x);
  drawCurrentStroke.ys.push(y);
  drawCurrentStroke.ts.push(Date.now());
  drawCtx.lineTo(x, y);
  drawCtx.stroke();
  drawCtx.beginPath();
  drawCtx.moveTo(x, y);
}

function endDrawStroke(e) {
  if (!drawIsDrawing || !drawCurrentStroke) return;
  e.preventDefault();
  drawIsDrawing = false;
  drawStrokes.push(drawCurrentStroke);
  drawCurrentStroke = null;
  clearTimeout(drawRecognizeTimer);
  drawRecognizeTimer = setTimeout(recognizeDrawing, HANDWRITING_DELAY_MS);
}

drawCanvas.addEventListener('mousedown', startDrawStroke);
drawCanvas.addEventListener('mousemove', moveDrawStroke);
drawCanvas.addEventListener('mouseup', endDrawStroke);
drawCanvas.addEventListener('mouseleave', endDrawStroke);
drawCanvas.addEventListener('touchstart', startDrawStroke, { passive: false });
drawCanvas.addEventListener('touchmove', moveDrawStroke, { passive: false });
drawCanvas.addEventListener('touchend', endDrawStroke);

async function recognizeDrawing() {
  if (drawStrokes.length === 0) return;

  const ink = drawStrokes.map(s => {
    const t0 = s.ts[0];
    return [
      s.xs.map(Math.round),
      s.ys.map(Math.round),
      s.ts.map(t => t - t0)
    ];
  });

  try {
    const resp = await fetch(
      'https://inputtools.google.com/request?itc=zh-t-i0-handwrit&app=translate',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          options: 'enable_pre_space',
          requests: [{
            writing_guide: {
              writing_area_width: drawCanvas.width,
              writing_area_height: drawCanvas.height
            },
            ink: ink,
            pre_context: '',
            max_num_results: 8,
            max_completions: 0
          }]
        })
      }
    );
    const data = await resp.json();

    if (data[0] === 'SUCCESS' && data[1] && data[1][0]) {
      const chars = data[1][0][1].filter(ch => ch.length === 1 && /[一-鿿㐀-䶿]/.test(ch)).slice(0, 8);
      renderDrawCandidates(chars);
    } else {
      drawCandidatesEl.innerHTML = '<span class="draw-candidates-placeholder">no matches</span>';
    }
  } catch (err) {
    drawCandidatesEl.innerHTML = '<span class="draw-candidates-placeholder">error - try serving via HTTP</span>';
  }
}

function renderDrawCandidates(chars) {
  drawCandidatesEl.innerHTML = '';
  for (const ch of chars) {
    const btn = document.createElement('button');
    btn.className = 'draw-candidate-btn';
    btn.textContent = ch;
    btn.onclick = () => selectDrawCandidate(ch);
    drawCandidatesEl.appendChild(btn);
  }
}

function appendCandidateToSource(ch) {
  const input = document.getElementById('english-input');
  if (/[a-zA-Z]/.test(input.value)) input.value = '';
  input.value += ch;
}

function selectDrawCandidate(ch) {
  appendCandidateToSource(ch);
  clearDrawCanvas();
  document.getElementById('english-input').focus();
}

function undoDrawStroke() {
  if (drawStrokes.length === 0) return;
  drawStrokes.pop();
  redrawAllStrokes();
  if (drawStrokes.length > 0) {
    clearTimeout(drawRecognizeTimer);
    drawRecognizeTimer = setTimeout(recognizeDrawing, HANDWRITING_DELAY_MS);
  } else {
    drawCandidatesEl.innerHTML = '<span class="draw-candidates-placeholder">candidates appear here</span>';
    drawHint.style.opacity = '1';
  }
}

function clearDrawCanvas() {
  drawStrokes = [];
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  drawCandidatesEl.innerHTML = '<span class="draw-candidates-placeholder">candidates appear here</span>';
  drawHint.style.opacity = '1';
}

function redrawAllStrokes() {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  for (const s of drawStrokes) {
    drawCtx.beginPath();
    drawCtx.moveTo(s.xs[0], s.ys[0]);
    for (let i = 1; i < s.xs.length; i++) {
      drawCtx.lineTo(s.xs[i], s.ys[i]);
    }
    drawCtx.stroke();
  }
}

// Input method tab switching
let activeInputTab = 'draw';

function switchInputTab(tab) {
  activeInputTab = tab;
  const drawContent = document.getElementById('draw-tab-content');
  const pinyinContent = document.getElementById('pinyin-tab-content');
  const drawCands = document.getElementById('draw-candidates');
  const drawCtls = document.getElementById('draw-controls');
  const strokeCtls = document.getElementById('stroke-controls');
  const pinyinCtls = document.getElementById('pinyin-controls');
  const tabDraw = document.getElementById('tab-draw');
  const tabPinyin = document.getElementById('tab-pinyin');

  if (tab === 'draw') {
    drawContent.style.display = '';

    tabPinyin.classList.remove('active');

    if (strokeOrderWrapper.style.display !== 'none') {
      drawCtls.style.display = 'none';
      strokeCtls.style.display = 'flex';
    } else {
      drawCtls.style.display = 'flex';
      strokeCtls.style.display = 'none';
    }
  } else {
    drawContent.style.display = 'none';
    pinyinContent.style.display = '';
    drawCands.style.display = 'none';
    drawCtls.style.display = 'none';
    strokeCtls.style.display = 'none';
    pinyinCtls.style.display = 'flex';
    tabDraw.classList.remove('active');
    tabPinyin.classList.add('active');
    document.getElementById('pinyin-input').focus();
  }
}

// Pinyin input recognition
let pinyinLookupTimer = null;
const PINYIN_DEBOUNCE_MS = 300;

function isPinyin(text) {
  return /^[a-zA-Z\s]+$/.test(text);
}

document.getElementById('pinyin-input').addEventListener('input', function() {
  clearTimeout(pinyinLookupTimer);
  const text = this.value.trim();
  if (!text) {
    document.getElementById('pinyin-candidates').innerHTML =
      '<span class="pinyin-candidates-placeholder">candidates appear here</span>';
    return;
  }
  if (!isPinyin(text)) return;
  pinyinLookupTimer = setTimeout(() => lookupPinyin(text), PINYIN_DEBOUNCE_MS);
});

document.getElementById('pinyin-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const firstCandidate = document.querySelector('#pinyin-candidates .pinyin-candidate-btn');
    if (firstCandidate) {
      selectPinyinCandidate(firstCandidate.textContent);
    } else {
      clearTimeout(pinyinLookupTimer);
      const text = this.value.trim();
      if (text && isPinyin(text)) lookupPinyin(text);
    }
  }
});

async function lookupPinyin(text) {
  try {
    const resp = await fetch(
      'https://inputtools.google.com/request?itc=zh-t-i0-pinyin&text=' +
        encodeURIComponent(text) + '&num=8',
      { method: 'GET' }
    );
    const data = await resp.json();

    if (data[0] === 'SUCCESS' && data[1] && data[1][0] && data[1][0][1]) {
      const candidates = data[1][0][1].filter(c => /^[一-鿿㐀-䶿]+$/.test(c)).slice(0, 6);
      renderPinyinCandidates(candidates);
    } else {
      document.getElementById('pinyin-candidates').innerHTML =
        '<span class="pinyin-candidates-placeholder">no matches</span>';
    }
  } catch {
    document.getElementById('pinyin-candidates').innerHTML =
      '<span class="pinyin-candidates-placeholder">lookup failed</span>';
  }
}

function renderPinyinCandidates(candidates) {
  const container = document.getElementById('pinyin-candidates');
  container.innerHTML = '';
  for (const ch of candidates) {
    const btn = document.createElement('button');
    btn.className = 'pinyin-candidate-btn';
    btn.textContent = ch;
    btn.onclick = () => selectPinyinCandidate(ch);
    container.appendChild(btn);
  }
}

function selectPinyinCandidate(ch) {
  appendCandidateToSource(ch);
  clearPinyinInput();
  document.getElementById('pinyin-input').focus();
}

function clearPinyinInput() {
  document.getElementById('pinyin-input').value = '';
  document.getElementById('pinyin-candidates').innerHTML =
    '<span class="pinyin-candidates-placeholder">candidates appear here</span>';
}

// Stroke order animation
let strokeWriter = null;
const drawCanvasWrapper = document.getElementById('draw-canvas-wrapper');
const strokeOrderWrapper = document.getElementById('stroke-order-wrapper');
const strokeControls = document.getElementById('stroke-controls');
const drawControlsEl = document.getElementById('draw-controls');

function renderClickableChars(el, text) {
  el.innerHTML = '';
  for (const ch of text) {
    if (/[一-鿿㐀-䶿]/.test(ch)) {
      const span = document.createElement('span');
      span.className = 'stroke-char';
      span.textContent = ch;
      span.onclick = () => showStrokeOrder(ch);
      el.appendChild(span);
    } else {
      el.appendChild(document.createTextNode(ch));
    }
  }
}

function showStrokeOrder(char) {
  if (activeInputTab !== 'draw') switchInputTab('draw');

  if (strokeWriter) {
    strokeWriter.hideCharacter();
    strokeWriter = null;
  }
  document.getElementById('stroke-order-target').innerHTML = '';

  strokeWriter = HanziWriter.create('stroke-order-target', char, {
    width: 176,
    height: 130,
    padding: 10,
    strokeColor: '#1a1a2e',
    radicalColor: '#C41E3A',
    delayBetweenStrokes: 150,
    strokeAnimationSpeed: 1.5
  });
  strokeWriter.animateCharacter();

  drawCanvasWrapper.style.display = 'none';
  strokeOrderWrapper.style.display = 'block';
  drawControlsEl.style.display = 'none';
  strokeControls.style.display = 'flex';
  drawCandidatesEl.innerHTML = '';
}

function hideStrokeOrder() {
  drawCanvasWrapper.style.display = 'block';
  strokeOrderWrapper.style.display = 'none';
  drawControlsEl.style.display = 'flex';
  strokeControls.style.display = 'none';
  if (drawStrokes.length === 0) {
    drawCandidatesEl.innerHTML = '<span class="draw-candidates-placeholder">candidates appear here</span>';
    drawHint.style.opacity = '1';
  }
}

function replayStrokeOrder() {
  if (strokeWriter) strokeWriter.animateCharacter();
}

function resetInputPanels() {
  clearDrawCanvas();
  clearPinyinInput();
  if (strokeOrderWrapper.style.display !== 'none') hideStrokeOrder();
}

// Clear draw/pinyin panels when the hub brings this page back into view.
// The hub sends mandarin-hub:visible (handled above), but also calls
// contentWindow.focus() - listen for that as a fallback on file:// where
// cross-origin postMessage can be unreliable.
let pageHasBeenHidden = false;
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'mandarin-hub:hidden') pageHasBeenHidden = true;
});
window.addEventListener('focus', () => {
  if (!pageHasBeenHidden) return;
  pageHasBeenHidden = false;
  resetInputPanels();
});
</script>
