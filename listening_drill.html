<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listening Drill - Mandarin Chinese</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Crimson+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --rice-paper: #F5F0E8;
  --card-bg: #FFFDF8;
  --ink: #1a1a2e;
  --vermillion: #C41E3A;
  --sage: #7D8471;
  --ink-wash: #6B7B8D;
  --warm-border: #E8E0D4;
  --correct: #2E7D32;
  --correct-bg: rgba(46, 125, 50, 0.08);
  --wrong: #C62828;
  --wrong-bg: rgba(198, 40, 40, 0.08);
}

body {
  font-family: 'Crimson Pro', 'PingFang TC', 'Noto Sans TC',
    'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', serif;
  background: var(--rice-paper);
  background-image:
    repeating-linear-gradient(
      0deg, transparent, transparent 40px,
      rgba(184, 134, 11, 0.03) 40px,
      rgba(184, 134, 11, 0.03) 41px
    ),
    repeating-linear-gradient(
      90deg, transparent, transparent 40px,
      rgba(184, 134, 11, 0.03) 40px,
      rgba(184, 134, 11, 0.03) 41px
    );
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.6;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

.page-header {
  text-align: center;
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 2px solid var(--warm-border);
  position: relative;
}

.page-header::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 2px;
  background: var(--vermillion);
}

.page-header h1 {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-size: 2rem;
  font-weight: 700;
  color: var(--vermillion);
  letter-spacing: 0.02em;
  margin-bottom: 4px;
}

.page-header .subtitle {
  font-size: 0.95rem;
  color: var(--ink-wash);
  font-weight: 400;
  letter-spacing: 0.04em;
}

/* Lesson Picker */

.lesson-picker {
  background: var(--card-bg);
  border: 1px solid var(--warm-border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: 0 2px 12px rgba(139, 119, 75, 0.06);
}

.lesson-picker h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 16px;
}

.lesson-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 6px;
  margin-bottom: 16px;
}

.lesson-cb {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.15s;
}

.lesson-cb:hover { background: var(--rice-paper); }
.lesson-cb input { accent-color: var(--vermillion); }

.picker-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.btn {
  font-family: 'Crimson Pro', serif;
  font-size: 0.95rem;
  padding: 8px 20px;
  border: 1px solid var(--warm-border);
  border-radius: 8px;
  background: var(--card-bg);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s;
}

.btn:hover { border-color: var(--vermillion); color: var(--vermillion); }

.btn-start {
  background: var(--vermillion);
  color: #fff;
  border-color: var(--vermillion);
  font-weight: 600;
}

.btn-start:hover { background: #a3182f; border-color: #a3182f; color: #fff; }

/* Quiz Area */

.quiz-area {
  display: none;
}

.progress-bar {
  font-size: 0.85rem;
  color: var(--ink-wash);
  margin-top: 2px;
}

.progress-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 20px;
}

.progress-row .back-btn {
  font-family: 'Crimson Pro', serif;
  font-size: 0.8rem;
  padding: 4px 10px;
  border: 1px solid var(--warm-border);
  border-radius: 6px;
  background: var(--card-bg);
  color: var(--ink-wash);
  cursor: pointer;
  transition: all 0.15s;
}

.progress-row .back-btn:hover {
  border-color: var(--vermillion);
  color: var(--vermillion);
}

.speaker-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid var(--warm-border);
  background: var(--card-bg);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  transition: all 0.2s;
}

.speaker-btn:hover {
  border-color: var(--vermillion);
  transform: scale(1.1);
}

.speaker-btn:active { transform: scale(0.95); }

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 24px;
}

.choice-btn {
  font-family: 'Crimson Pro', serif;
  font-size: 1.05rem;
  padding: 14px 14px 14px 18px;
  border: 1px solid var(--warm-border);
  border-radius: 10px;
  background: var(--card-bg);
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
  line-height: 1.4;
  display: flex;
  align-items: center;
  gap: 10px;
}

.choice-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--rice-paper);
  border: 1px solid var(--warm-border);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink-wash);
  flex-shrink: 0;
}

.choice-btn:hover:not(.locked) {
  border-color: var(--vermillion);
  background: rgba(196, 30, 58, 0.03);
}

.choice-btn.correct {
  border-color: var(--correct);
  background: var(--correct-bg);
  color: var(--correct);
  font-weight: 600;
}

.choice-btn.wrong {
  border-color: var(--wrong);
  background: var(--wrong-bg);
  color: var(--wrong);
  opacity: 0.7;
}

.choice-btn.locked { cursor: default; }

/* Reveal Card */

.reveal-card {
  display: none;
  background: var(--card-bg);
  border: 1px solid var(--warm-border);
  border-radius: 12px;
  padding: 20px 24px;
  text-align: center;
  box-shadow: 0 2px 12px rgba(139, 119, 75, 0.06);
}

.reveal-card .zh {
  font-size: 1.8rem;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 4px;
}

.reveal-card .trad {
  font-size: 1.1rem;
  color: var(--ink-wash);
  opacity: 0.7;
}

/* Footer */

.page-footer {
  text-align: center;
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid var(--warm-border);
  color: var(--ink-wash);
  font-size: 0.9rem;
}

.page-footer .deco {
  color: var(--vermillion);
  opacity: 0.3;
  font-size: 1.2rem;
  font-family: 'PingFang TC', 'Noto Serif TC', serif;
  letter-spacing: 8px;
  margin-bottom: 8px;
}

@media (max-width: 600px) {
  .container { padding: 24px 14px 60px; }
  .page-header h1 { font-size: 1.6rem; }
  .lesson-grid { grid-template-columns: 1fr; }
  .choices { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="container">

  <div class="page-header">
    <h1>Listening Drill</h1>
    <p class="subtitle">Hear first, then pick the meaning</p>
  </div>

  <div class="lesson-picker" id="lesson-picker">
    <h2>Choose Lessons</h2>
    <div class="lesson-grid" id="lesson-grid"></div>
    <div class="picker-actions">
      <button class="btn" onclick="toggleAll()">Select All</button>
      <button class="btn btn-start" onclick="startDrill()">Start</button>
    </div>
  </div>

  <div class="quiz-area" id="quiz-area">
    <div class="progress-row">
      <button class="back-btn" onclick="showPicker()" title="Change lessons">Lessons</button>
      <span class="progress-bar" id="progress"></span>
      <button class="speaker-btn" id="replay-btn" onclick="replayCurrent()" title="Replay audio (R)">&#x1F50A;</button>
    </div>

    <div class="choices" id="choices"></div>

    <div class="reveal-card" id="reveal-card">
      <div class="zh" id="reveal-zh"></div>
      <div class="trad" id="reveal-trad"></div>
    </div>
  </div>

  <div class="page-footer">
    <div class="deco">听 力 练 习</div>
  </div>

</div>

<script src="data/phrases.js"></script>
<script>
const DATA = (() => {
  const lessons = [];
  const idx = {};
  window.PHRASES.forEach(p => {
    if (!idx[p.lesson]) {
      idx[p.lesson] = { title: p.lessonTitle, sections: {} };
      lessons.push(idx[p.lesson]);
    }
    const l = idx[p.lesson];
    if (!l.sections[p.section]) {
      l.sections[p.section] = [];
    }
    l.sections[p.section].push(p);
  });
  return lessons.map(l => ({
    title: l.title,
    sections: Object.keys(l.sections).map(s => ({
      title: s,
      phrases: l.sections[s]
    }))
  }));
})();

let allPhrases = [];
let lessonRanges = [];

DATA.forEach((lesson, li) => {
  const start = allPhrases.length;
  lesson.sections.forEach(sec => {
    sec.phrases.forEach(p => {
      allPhrases.push({ ...p, lessonIdx: li, lesson: lesson.title });
    });
  });
  lessonRanges.push({ start, end: allPhrases.length });
});

const selectedLessons = new Set();
let queue = [];
let qIdx = 0;
let correctCount = 0;
let wrongCount = 0;
let advanceTimer = null;
let ttsAudio = null;

function speak(chinese) {
  if (!chinese) return;
  if (ttsAudio) { ttsAudio.pause(); ttsAudio.src = ''; }
  const youdao = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(chinese)}&le=zh`;
  const google = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=${encodeURIComponent(chinese)}`;
  const engine = localStorage.getItem('tts_engine')
    || (location.protocol === 'file:' ? 'youdao' : 'google');
  const primary = engine === 'youdao' ? youdao : google;
  const fallback = engine === 'youdao' ? google : youdao;
  const slowdown = (primary === youdao);
  ttsAudio = new Audio(primary);
  if (slowdown) ttsAudio.playbackRate = 0.75;
  ttsAudio.play().catch(() => {
    ttsAudio = new Audio(fallback);
    if (!slowdown) ttsAudio.playbackRate = 0.75;
    ttsAudio.play().catch(err => console.warn('TTS unavailable:', err.name));
  });
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function buildPicker() {
  const grid = document.getElementById('lesson-grid');
  DATA.forEach((lesson, i) => {
    const label = document.createElement('label');
    label.className = 'lesson-cb';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = false;
    cb.addEventListener('change', () => {
      if (cb.checked) selectedLessons.add(i);
      else selectedLessons.delete(i);
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(lesson.title));
    grid.appendChild(label);
  });
}

function toggleAll() {
  const cbs = document.querySelectorAll('#lesson-grid input');
  const allChecked = [...cbs].every(c => c.checked);
  cbs.forEach((cb, i) => {
    cb.checked = !allChecked;
    if (!allChecked) selectedLessons.add(i);
    else selectedLessons.delete(i);
  });
}

function startDrill() {
  if (selectedLessons.size === 0) return;

  queue = [];
  selectedLessons.forEach(li => {
    const r = lessonRanges[li];
    for (let i = r.start; i < r.end; i++) queue.push(i);
  });
  shuffle(queue);

  qIdx = 0;
  correctCount = 0;
  wrongCount = 0;

  document.getElementById('lesson-picker').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';

  showQuestion();
}

function getDistractors(phraseIdx) {
  const phrase = allPhrases[phraseIdx];
  const li = phrase.lessonIdx;
  const r = lessonRanges[li];

  let pool = [];
  for (let i = r.start; i < r.end; i++) {
    if (i !== phraseIdx) pool.push(i);
  }

  if (pool.length < 3) {
    const before = li > 0 ? lessonRanges[li - 1] : null;
    const after = li < lessonRanges.length - 1 ? lessonRanges[li + 1] : null;
    if (before) {
      for (let i = before.start; i < before.end; i++) {
        if (i !== phraseIdx) pool.push(i);
      }
    }
    if (after) {
      for (let i = after.start; i < after.end; i++) {
        if (i !== phraseIdx) pool.push(i);
      }
    }
  }

  shuffle(pool);
  return pool.slice(0, 3);
}

function showQuestion() {
  if (qIdx >= queue.length) {
    finishDrill();
    return;
  }

  clearTimeout(advanceTimer);

  const phraseIdx = queue[qIdx];
  const phrase = allPhrases[phraseIdx];

  document.getElementById('progress').textContent =
    (qIdx + 1) + ' / ' + queue.length;

  document.getElementById('reveal-card').style.display = 'none';

  const distractors = getDistractors(phraseIdx);
  const options = [phraseIdx, ...distractors];
  shuffle(options);

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';

  options.forEach((optIdx, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    const num = document.createElement('span');
    num.className = 'choice-num';
    num.textContent = i + 1;
    btn.appendChild(num);
    btn.appendChild(document.createTextNode(allPhrases[optIdx].meaning));
    btn.dataset.optIdx = optIdx;
    btn.addEventListener('click', () => handleChoice(btn, optIdx, phraseIdx));
    choicesEl.appendChild(btn);
  });

  speak(phrase.simp);
}

function handleChoice(btn, chosenIdx, correctIdx) {
  const buttons = document.querySelectorAll('.choice-btn');
  const alreadyLocked = buttons[0] && buttons[0].classList.contains('locked');
  if (alreadyLocked) return;

  buttons.forEach(b => {
    b.classList.add('locked');
    const bMeaning = b.textContent;
    if (bMeaning === allPhrases[correctIdx].meaning) {
      b.classList.add('correct');
    }
  });

  const isCorrect = chosenIdx === correctIdx;

  if (isCorrect) {
    correctCount++;
  } else {
    wrongCount++;
    btn.classList.add('wrong');
    const insertAt = Math.min(qIdx + 5, queue.length);
    queue.splice(insertAt, 0, correctIdx);
  }

  const phrase = allPhrases[correctIdx];
  const revealCard = document.getElementById('reveal-card');
  document.getElementById('reveal-zh').textContent = phrase.simp;
  const showTrad = phrase.trad !== phrase.simp;
  document.getElementById('reveal-trad').textContent = showTrad ? phrase.trad : '';
  document.getElementById('reveal-trad').style.display = showTrad ? '' : 'none';
  revealCard.style.display = 'block';

  speak(phrase.simp);

  advanceTimer = setTimeout(() => {
    qIdx++;
    showQuestion();
  }, 2500);
}

function replayCurrent() {
  if (qIdx < queue.length) {
    speak(allPhrases[queue[qIdx]].simp);
  }
}

function finishDrill() {
  queue = [];
  selectedLessons.forEach(li => {
    const r = lessonRanges[li];
    for (let i = r.start; i < r.end; i++) queue.push(i);
  });
  shuffle(queue);
  qIdx = 0;
  showQuestion();
}

function showPicker() {
  clearTimeout(advanceTimer);
  if (ttsAudio) { ttsAudio.pause(); ttsAudio.src = ''; }
  document.getElementById('lesson-picker').style.display = '';
  document.getElementById('quiz-area').style.display = 'none';
}

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const quizVisible = document.getElementById('quiz-area').style.display === 'block';
  if (!quizVisible) return;

  if (e.key === 'r' || e.key === 'R' || e.key === ' ') {
    e.preventDefault();
    replayCurrent();
    return;
  }

  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= 4) {
    const btns = document.querySelectorAll('.choice-btn');
    if (btns[num - 1] && !btns[num - 1].classList.contains('locked')) {
      btns[num - 1].click();
    }
  }
});

buildPicker();

window.addEventListener('message', e => {
  if (e.source !== window.parent) return;
  if (!e.data) return;
  if (e.data.type === 'mandarin-hub:hidden') {
    if (ttsAudio) { ttsAudio.pause(); ttsAudio.src = ''; }
    clearTimeout(advanceTimer);
  }
  if (e.data.type === 'mandarin-hub:visible' && e.data.scrollY != null) {
    const y = e.data.scrollY;
    setTimeout(() => { requestAnimationFrame(() => { requestAnimationFrame(() => window.scrollTo(0, y)); }); }, 50);
  }
});
</script>
</body>
</html>
