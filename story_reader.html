<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Crimson+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Crimson Pro", "PingFang TC", "Noto Sans TC", "Microsoft YaHei", serif;
  background: #F5F0E8;
  color: #1a1a2e;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(196,30,58,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(184,134,11,0.03) 0%, transparent 50%);
}

/* --- Library view --- */
.library {
  max-width: 640px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
}
.library h1 {
  font-family: "Cormorant Garamond", "PingFang TC", serif;
  font-size: 2rem;
  font-weight: 700;
  text-align: center;
  margin-bottom: 0.3rem;
  color: #1a1a2e;
}
.library .subtitle {
  text-align: center;
  color: #666;
  font-size: 0.95rem;
  margin-bottom: 1.5rem;
}
.story-card {
  background: #fff;
  border: 1px solid #d4cec4;
  border-radius: 10px;
  padding: 1.2rem 1.4rem;
  margin-bottom: 0.8rem;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
}
.story-card:hover {
  border-color: #c41e3a88;
  box-shadow: 0 2px 8px rgba(196,30,58,0.08);
}
.story-card-title {
  font-family: "Cormorant Garamond", "PingFang TC", serif;
  font-size: 1.3rem;
  font-weight: 600;
  color: #1a1a2e;
  margin-bottom: 0.15rem;
}
.story-card-title-en {
  font-size: 0.9rem;
  color: #888;
  margin-bottom: 0.4rem;
}
.story-card-desc {
  font-size: 0.9rem;
  color: #666;
  line-height: 1.4;
}
.story-card-meta {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-top: 0.5rem;
  font-size: 0.8rem;
  color: #999;
}
.story-card-progress {
  color: #c41e3a;
  font-weight: 500;
}

/* --- Reader view --- */
.reader {
  display: none;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 1.5rem 6rem;
}
.reader-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #F5F0E8;
  padding: 0.8rem 0;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  border-bottom: 1px solid #d4cec4;
  margin-bottom: 1.2rem;
}
.back-btn {
  background: none;
  border: none;
  color: #c41e3a;
  font-size: 0.95rem;
  cursor: pointer;
  font-family: inherit;
  padding: 0.3rem 0;
  white-space: nowrap;
}
.back-btn:hover { text-decoration: underline; }
.reader-title {
  font-family: "Cormorant Garamond", "PingFang TC", serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: #1a1a2e;
  flex: 1;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.toggle-en-btn {
  background: none;
  border: 1px solid #bbb;
  color: #888;
  font-size: 0.8rem;
  padding: 0.25rem 0.6rem;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.toggle-en-btn.active {
  border-color: #c41e3a;
  color: #c41e3a;
}

.story-title-display {
  font-family: "Cormorant Garamond", "PingFang TC", serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: #1a1a2e;
  margin-bottom: 1.2rem;
}

.story-line {
  padding: 0.6rem 0.8rem;
  margin-bottom: 0.3rem;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s;
  line-height: 1.7;
}
.story-line:hover {
  background: rgba(196,30,58,0.04);
}
.story-line.playing {
  background: rgba(196,30,58,0.08);
  border-left: 3px solid #c41e3a;
  padding-left: calc(0.8rem - 3px);
}
.line-zh {
  font-size: 1.35rem;
  color: #1a1a2e;
  margin-bottom: 0.2rem;
}
.line-en {
  font-size: 0.9rem;
  color: #888;
  display: none;
  font-style: italic;
}
.line-en.visible {
  display: block;
}

/* --- Playback bar --- */
.playback-bar {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  border-top: 1px solid #d4cec4;
  padding: 0.6rem 1.2rem;
  z-index: 20;
  align-items: center;
  gap: 0.8rem;
  box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
}
.play-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #c41e3a;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s;
}
.play-btn:hover { background: #a8182f; }
.play-btn svg {
  width: 20px;
  height: 20px;
  fill: #fff;
}
.playback-info {
  flex: 1;
  font-size: 0.85rem;
  color: #555;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.playback-progress {
  font-size: 0.8rem;
  color: #999;
  white-space: nowrap;
}
.speed-btn {
  background: none;
  border: 1px solid #bbb;
  color: #666;
  font-size: 0.75rem;
  padding: 0.2rem 0.5rem;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.speed-btn:hover { border-color: #888; color: #333; }

@media (max-width: 480px) {
  .library { padding: 1rem; }
  .reader { padding: 0 1rem 5.5rem; }
  .line-zh { font-size: 1.2rem; }
  .story-title-display { font-size: 1.3rem; }
}
</style>
</head>
<body>

<div class="library" id="library">
  <h1>Story Reader</h1>
  <p class="subtitle">Practice reading with stories built from your phrase vocabulary</p>
  <div id="story-list"></div>
</div>

<div class="reader" id="reader">
  <div class="reader-header">
    <button class="back-btn" id="back-btn">&larr; Library</button>
    <div class="reader-title" id="reader-title"></div>
    <button class="toggle-en-btn" id="toggle-en-btn">EN</button>
  </div>
  <div id="story-lines"></div>
</div>

<div class="playback-bar" id="playback-bar">
  <button class="play-btn" id="play-btn">
    <svg id="play-icon" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
    <svg id="pause-icon" viewBox="0 0 24 24" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
  </button>
  <div class="playback-info" id="playback-info">Tap play to start</div>
  <div class="playback-progress" id="playback-progress"></div>
  <button class="speed-btn" id="speed-btn">1x</button>
</div>

<script src="data/stories.js"></script>
<script>
let ttsAudio = null;
let isPlaying = false;
let currentLineIndex = -1;
let currentStory = null;
let showEnglish = false;
let playbackSpeed = 0.75;
const speeds = [0.75, 1, 1.25];
let speedIndex = 0;

const PROGRESS_KEY = 'story-reader-progress';

function getProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }
  catch { return {}; }
}

function saveProgress(storyId, lineIndex) {
  const p = getProgress();
  p[storyId] = { line: lineIndex, ts: Date.now() };
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch {}
}

function renderLibrary() {
  const list = document.getElementById('story-list');
  const progress = getProgress();
  list.innerHTML = '';
  window.STORIES.forEach(story => {
    const card = document.createElement('div');
    card.className = 'story-card';
    let meta = story.lines.length + ' sentences';
    card.innerHTML =
      `<div class="story-card-title">${story.title}</div>` +
      `<div class="story-card-title-en">${story.titleEn}</div>` +
      `<div class="story-card-desc">${story.description}</div>` +
      `<div class="story-card-meta">${meta}</div>`;
    card.addEventListener('click', () => openStory(story));
    list.appendChild(card);
  });
}

function openStory(story) {
  currentStory = story;
  currentLineIndex = -1;
  isPlaying = false;

  document.getElementById('library').style.display = 'none';
  document.getElementById('reader').style.display = 'block';
  document.getElementById('playback-bar').style.display = 'flex';

  document.getElementById('reader-title').textContent = story.title + ' — ' + story.titleEn;
  document.getElementById('playback-info').textContent = 'Tap play to start';
  document.getElementById('playback-progress').textContent = '';

  const container = document.getElementById('story-lines');
  container.innerHTML = '';
  story.lines.forEach((line, i) => {
    const div = document.createElement('div');
    div.className = 'story-line';
    div.dataset.index = i;
    div.innerHTML =
      `<div class="line-zh">${line.zh}</div>` +
      `<div class="line-en${showEnglish ? ' visible' : ''}">${line.en}</div>`;
    div.addEventListener('click', () => {
      playSingleLine(i);
    });
    container.appendChild(div);
  });

  updatePlayIcon();

  const progress = getProgress();
  if (progress[story.id] && progress[story.id].line > 0) {
    const lineEl = container.children[progress[story.id].line];
    if (lineEl) {
      setTimeout(() => lineEl.scrollIntoView({ block: 'center' }), 100);
    }
  }
}

function closeStory() {
  stopPlayback();
  document.getElementById('library').style.display = 'block';
  document.getElementById('reader').style.display = 'none';
  document.getElementById('playback-bar').style.display = 'none';
  currentStory = null;
  renderLibrary();
}

function toggleEnglish() {
  showEnglish = !showEnglish;
  const btn = document.getElementById('toggle-en-btn');
  btn.classList.toggle('active', showEnglish);
  document.querySelectorAll('.line-en').forEach(el => {
    el.classList.toggle('visible', showEnglish);
  });
}

function highlightLine(index) {
  document.querySelectorAll('.story-line').forEach(el => el.classList.remove('playing'));
  if (index >= 0) {
    const lines = document.querySelectorAll('.story-line');
    if (lines[index]) {
      lines[index].classList.add('playing');
      lines[index].scrollIntoView({ behavior: 'instant', block: 'center' });
    }
  }
}

function speak(chinese) {
  return new Promise((resolve, reject) => {
    if (!chinese) { resolve(); return; }

    if (ttsAudio) { ttsAudio.pause(); ttsAudio.src = ''; }

    const youdao = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(chinese)}&le=zh`;
    const google = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=${encodeURIComponent(chinese)}`;
    const engine = localStorage.getItem('tts_engine')
      || (location.protocol === 'file:' ? 'youdao' : 'google');
    const primary = engine === 'youdao' ? youdao : google;
    const fallback = engine === 'youdao' ? google : youdao;

    ttsAudio = new Audio(primary);
    ttsAudio.playbackRate = playbackSpeed;
    ttsAudio.onended = resolve;
    ttsAudio.onerror = () => {
      ttsAudio = new Audio(fallback);
      ttsAudio.playbackRate = playbackSpeed;
      ttsAudio.onended = resolve;
      ttsAudio.onerror = () => resolve();
      ttsAudio.play().catch(() => resolve());
    };
    ttsAudio.play().catch(() => {
      ttsAudio = new Audio(fallback);
      ttsAudio.playbackRate = playbackSpeed;
      ttsAudio.onended = resolve;
      ttsAudio.onerror = () => resolve();
      ttsAudio.play().catch(() => resolve());
    });
  });
}

function playSingleLine(index) {
  if (!currentStory) return;
  stopPlayback();
  currentLineIndex = index;
  highlightLine(index);
  updatePlaybackInfo();
  speak(currentStory.lines[index].zh);
}

async function startPlayback() {
  if (!currentStory) return;
  isPlaying = true;
  updatePlayIcon();

  let start = currentLineIndex >= 0 ? currentLineIndex : 0;
  for (let i = start; i < currentStory.lines.length; i++) {
    if (!isPlaying) break;
    currentLineIndex = i;
    highlightLine(i);
    updatePlaybackInfo();
    saveProgress(currentStory.id, i);
    await speak(currentStory.lines[i].zh);
    if (!isPlaying) break;
    await pause(400);
  }

  if (isPlaying) {
    isPlaying = false;
    updatePlayIcon();
    saveProgress(currentStory.id, currentStory.lines.length);
    document.getElementById('playback-info').textContent = 'Finished';
  }
}

function pause(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function stopPlayback() {
  isPlaying = false;
  if (ttsAudio) { ttsAudio.pause(); ttsAudio.src = ''; ttsAudio = null; }
  updatePlayIcon();
}

function togglePlayback() {
  if (isPlaying) {
    stopPlayback();
  } else {
    startPlayback();
  }
}

function updatePlayIcon() {
  document.getElementById('play-icon').style.display = isPlaying ? 'none' : 'block';
  document.getElementById('pause-icon').style.display = isPlaying ? 'block' : 'none';
}

function updatePlaybackInfo() {
  if (!currentStory) return;
  const info = document.getElementById('playback-info');
  const prog = document.getElementById('playback-progress');
  const line = currentStory.lines[currentLineIndex];
  if (line) {
    info.textContent = line.zh;
    prog.textContent = (currentLineIndex + 1) + ' / ' + currentStory.lines.length;
  }
}

function cycleSpeed() {
  speedIndex = (speedIndex + 1) % speeds.length;
  playbackSpeed = speeds[speedIndex];
  document.getElementById('speed-btn').textContent = playbackSpeed + 'x';
  if (ttsAudio) ttsAudio.playbackRate = playbackSpeed;
}

// --- Event listeners ---
document.getElementById('back-btn').addEventListener('click', closeStory);
document.getElementById('toggle-en-btn').addEventListener('click', toggleEnglish);
document.getElementById('play-btn').addEventListener('click', togglePlayback);
document.getElementById('speed-btn').addEventListener('click', cycleSpeed);

// --- Hub integration ---
let scrollTimer;
window.addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    try {
      parent.postMessage({ type: 'mandarin-hub:scroll-report', scrollY: window.scrollY }, '*');
    } catch (e) {}
  }, 150);
}, { passive: true });

window.addEventListener('message', (e) => {
  if (e.source !== window.parent) return;
  if (!e.data) return;
  if (e.data.type === 'mandarin-hub:hidden') {
    stopPlayback();
    highlightLine(currentLineIndex);
  }
  if (e.data.type === 'mandarin-hub:visible' && e.data.scrollY != null) {
    const y = e.data.scrollY;
    setTimeout(() => { requestAnimationFrame(() => { requestAnimationFrame(() => window.scrollTo(0, y)); }); }, 50);
  }
});

// --- Init ---
renderLibrary();
</script>
</body>
</html>
