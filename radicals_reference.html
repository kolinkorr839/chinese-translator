<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radicals Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Crimson+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Crimson Pro', 'PingFang TC', 'Noto Sans TC', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', serif;
  background: #F5F0E8;
  color: #1a1a2e;
  min-height: 100vh;
  line-height: 1.45;
  zoom: 1.35;
  background-image:
    repeating-linear-gradient(
      0deg, transparent, transparent 40px,
      rgba(184, 134, 11, 0.03) 40px,
      rgba(184, 134, 11, 0.03) 41px
    ),
    repeating-linear-gradient(
      90deg, transparent, transparent 40px,
      rgba(184, 134, 11, 0.03) 40px,
      rgba(184, 134, 11, 0.03) 41px
    );
}

.header {
  text-align: center;
  color: #1a1a2e;
  padding: 16px 20px 24px;
  margin-bottom: 12px;
  border-bottom: 2px solid #E8E0D4;
  position: relative;
}

.header::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 2px;
  background: #C41E3A;
}

.header h1 {
  margin: 0;
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #C41E3A;
  font-family: "Cormorant Garamond", "Noto Serif CJK TC", "Noto Sans CJK TC", serif;
}

.page-wrap {
  max-width: 100%;
  margin: 0 auto;
  padding: 0 20px 3rem;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11pt;
  margin-top: 12px;
  background: #FFFDF8;
  border: 1px solid #E8E0D4;
  border-radius: 6px;
  box-shadow: 0 1px 4px rgba(139, 119, 75, 0.06);
}

thead th {
  background-color: #F5EDE0;
  color: #3D2B1F;
  font-weight: 700;
  text-align: left;
  padding: 6px 10px;
  border: 1px solid #D8CCBB;
  font-family: "Cormorant Garamond", "Noto Sans CJK TC", serif;
  font-size: 10pt;
}

thead th:first-child {
  width: 36px;
  text-align: center;
}

tbody tr {
  transition: background 0.15s;
}

tbody tr:nth-child(even) {
  background-color: #FAF5EC;
}

tbody tr:nth-child(odd) {
  background-color: #FFFDF8;
}

tbody tr:hover {
  background: rgba(196, 30, 58, 0.05);
}

td {
  padding: 5px 10px;
  border: 1px solid #E8E0D4;
  vertical-align: middle;
}

td:first-child {
  text-align: center;
  color: #8B7D6B;
  font-size: 9pt;
}

.radical-cell {
  font-size: 1.4rem;
  font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  white-space: nowrap;
}

.radical-main {
  color: #C41E3A;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.15s;
  padding: 1px 3px;
  border-radius: 3px;
}

.radical-main:hover {
  background: rgba(196, 30, 58, 0.1);
}

.radical-variant {
  font-size: 0.8rem;
  color: #5C4A32;
  margin-left: 3px;
  font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}

.meaning-cell {
  font-size: 9.5pt;
  color: #5C4A32;
  line-height: 1.4;
}

.examples {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  align-items: center;
}

.example-item {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  white-space: nowrap;
}

.example-char {
  font-size: 1.1rem;
  font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  cursor: pointer;
  transition: color 0.15s;
  padding: 1px 2px;
  border-radius: 3px;
  color: #3D2B1F;
}

.example-char:hover {
  color: #C41E3A;
  background: rgba(196, 30, 58, 0.06);
}

.example-detail {
  display: flex;
  flex-direction: column;
  justify-content: center;
  line-height: 1.2;
}

.example-meaning {
  font-size: 7.5pt;
  color: #8B7D6B;
}

.example-pinyin {
  font-size: 7.5pt;
  color: #A89880;
}

.lookup-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border: none;
  background: none;
  color: #C4B5A0;
  cursor: pointer;
  font-size: 0.7rem;
  border-radius: 3px;
  transition: color 0.15s, background 0.15s;
  padding: 0;
  flex-shrink: 0;
}

.lookup-btn:hover {
  color: #C41E3A;
  background: rgba(196, 30, 58, 0.08);
}

.draw-toggle-btn {
  width: 30px;
  height: 30px;
  border: 1px solid #E8E0D4;
  border-radius: 8px;
  background: #FFFDF8;
  color: #6B7B8D;
  cursor: pointer;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  vertical-align: middle;
  margin-left: 6px;
  position: relative;
  top: -2px;
}

.draw-toggle-btn:hover,
.draw-toggle-btn.active {
  border-color: #C41E3A;
  color: #C41E3A;
}

.draw-panel {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin: 8px auto 0;
  max-width: 460px;
  padding: 10px 20px 0;
}

.draw-panel.open { display: flex; }

.draw-canvas-wrapper { position: relative; }

#draw-canvas {
  border: 2px solid #E8E0D4;
  border-radius: 12px;
  cursor: crosshair;
  display: block;
  touch-action: none;
  background: #FFFDF8;
}

.draw-hint {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 14px;
  color: #C4B9A8;
  pointer-events: none;
  transition: opacity 0.2s;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-style: italic;
}

.draw-candidates {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  min-height: 34px;
  align-items: center;
}

.draw-candidates-placeholder {
  font-size: 12px;
  color: #C4B9A8;
}

.draw-candidate-btn {
  width: 36px;
  height: 36px;
  border: 1px solid #E8E0D4;
  border-radius: 10px;
  background: #FFFDF8;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  color: #1a1a2e;
}

.draw-candidate-btn:hover {
  background: #C41E3A;
  color: #fff;
  border-color: #C41E3A;
}

.draw-controls {
  display: flex;
  gap: 8px;
}

.draw-controls button {
  font-size: 12px;
  padding: 4px 12px;
  border: 1px solid #E8E0D4;
  border-radius: 8px;
  background: #FFFDF8;
  color: #6B7B8D;
  cursor: pointer;
  font-family: 'Crimson Pro', Georgia, serif;
  transition: all 0.15s;
}

.draw-controls button:hover {
  border-color: #C41E3A;
  color: #C41E3A;
}

.match-highlight { background: rgba(196, 30, 58, 0.12); border-radius: 3px; }

.draw-candidate-btn.lookup {
  border-style: dashed;
  border-color: #C4B9A8;
  color: #5C4A32;
}

.draw-candidate-btn.lookup:hover {
  background: #5C4A32;
  color: #fff;
  border-color: #5C4A32;
}

.draw-candidates-label {
  font-size: 11px;
  color: #8B7D6B;
  width: 100%;
  text-align: center;
}

.no-results-row td {
  text-align: center;
  color: #C4B9A8;
  font-style: italic;
  padding: 20px 10px;
}

@media (max-width: 600px) {
  .page-wrap { padding: 0 10px 2rem; }
  .header { padding: 12px 14px 18px; }
  .header h1 { font-size: 1.5rem; }
  table { font-size: 10pt; }
  td { padding: 4px 6px; }
  .radical-cell { font-size: 1.2rem; }
  .example-char { font-size: 1rem; }
  .draw-panel { padding: 8px 10px 0; }

  thead th:nth-child(3) { display: none; }
  td:nth-child(3) { display: none; }
}
</style>
</head>

<div class="header">

</div>

<div class="draw-panel" id="draw-panel">

    <canvas id="draw-canvas" width="220" height="150"></canvas>
    <div class="draw-hint" id="draw-hint">Draw a radical or character</div>
  </div>
  <div class="draw-candidates" id="draw-candidates">
    <span class="draw-candidates-placeholder">candidates appear here</span>
  </div>
  <div class="draw-controls">
    <button onclick="undoDrawStroke()">Undo</button>
    <button onclick="clearDrawCanvas()">Clear</button>
  </div>
</div>

<div class="page-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>

        <th>Meaning</th>
        <th>Examples</th>
      </tr>
    </thead>
    <tbody id="radical-body"></tbody>
  </table>
</div>

<script>
let ttsAudio = null;

function speak(chinese) {
  if (!chinese) return;
  if (ttsAudio) { ttsAudio.pause(); ttsAudio.src = ''; }

  const youdao = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(chinese)}&le=zh`;
  const google = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=${encodeURIComponent(chinese)}`;
  const primary = location.protocol === 'file:' ? youdao : google;
  const fallback = location.protocol === 'file:' ? google : youdao;

  const isFile = location.protocol === 'file:';
  ttsAudio = new Audio(primary);
  if (isFile) ttsAudio.playbackRate = 0.75;
  ttsAudio.play().catch(() => {
    ttsAudio = new Audio(fallback);
    if (!isFile) ttsAudio.playbackRate = 0.75;
    ttsAudio.play().catch(err => console.warn('TTS unavailable:', err.name));
  });
}

function lookupInTranslator(query) {
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'mandarin-hub:lookup', query }, '*');
  }
}

function showStrokeOrder(char) {
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'mandarin-hub:stroke-order', char }, '*');
  }
}

// --- Lookup maps for radical matching ---
const radicalSet = new Set();
const variantToRadical = new Map();
const exampleToRadicals = new Map();

RADICALS.forEach(rd => {
  radicalSet.add(rd.r);
  if (rd.v) variantToRadical.set(rd.v, rd.r);
  rd.ex.forEach(([ch]) => {
    if (!exampleToRadicals.has(ch)) exampleToRadicals.set(ch, new Set());
    exampleToRadicals.get(ch).add(rd.r);
  });
});

function resolveToRadicals(chars) {
  const seen = new Set();
  const results = [];
  for (const ch of chars) {
    let radicals = [];
    if (radicalSet.has(ch)) {
      radicals = [ch];
    } else if (variantToRadical.has(ch)) {
      radicals = [variantToRadical.get(ch)];
    } else if (exampleToRadicals.has(ch)) {
      radicals = [...exampleToRadicals.get(ch)];
    }
    for (const r of radicals) {
      if (!seen.has(r)) { seen.add(r); results.push(r); }
    }
  }
  return results;
}

// --- Filter table by character ---
function filterTable(query) {
  const q = query.trim();
  let anyVisible = false;

  const noResultsRow = tbody.querySelector('.no-results-row');
  if (noResultsRow) noResultsRow.remove();

  allRows.forEach(({ tr, data }) => {
    if (!q) { tr.style.display = ''; anyVisible = true; return; }

    if (data.r === q || data.v === q) {
      tr.style.display = '';
      anyVisible = true;
    } else {
      tr.style.display = 'none';
    }
  });

  if (q && !anyVisible) {
    const row = document.createElement('tr');
    row.className = 'no-results-row';
    const td = document.createElement('td');
    td.colSpan = 4;
    td.textContent = 'No matching radicals found';
    row.appendChild(td);
    tbody.appendChild(row);
  }
}

function resetFilter() {
  allRows.forEach(({ tr }) => { tr.style.display = ''; });
  const noResultsRow = tbody.querySelector('.no-results-row');
  if (noResultsRow) noResultsRow.remove();
}

// --- Handwriting recognition ---
const HANDWRITING_DELAY_MS = 1200;
const drawCanvas = document.getElementById('draw-canvas');
const drawCtx = drawCanvas.getContext('2d');
const drawHint = document.getElementById('draw-hint');
const drawCandidatesEl = document.getElementById('draw-candidates');

drawCtx.strokeStyle = '#1a1a2e';
drawCtx.lineWidth = 3;
drawCtx.lineCap = 'round';
drawCtx.lineJoin = 'round';

let drawStrokes = [];
let drawCurrentStroke = null;
let drawIsDrawing = false;
let drawRecognizeTimer = null;

function getDrawPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  if (e.touches) {
    return [
      (e.touches[0].clientX - rect.left) * scaleX,
      (e.touches[0].clientY - rect.top) * scaleY
    ];
  }
  return [
    (e.clientX - rect.left) * scaleX,
    (e.clientY - rect.top) * scaleY
  ];
}

function startDrawStroke(e) {
  e.preventDefault();
  drawIsDrawing = true;
  const [x, y] = getDrawPos(e);
  drawCurrentStroke = { xs: [x], ys: [y], ts: [Date.now()] };
  drawCtx.beginPath();
  drawCtx.moveTo(x, y);
  drawHint.style.opacity = '0';
}

function moveDrawStroke(e) {
  if (!drawIsDrawing || !drawCurrentStroke) return;
  e.preventDefault();
  const [x, y] = getDrawPos(e);
  drawCurrentStroke.xs.push(x);
  drawCurrentStroke.ys.push(y);
  drawCurrentStroke.ts.push(Date.now());
  drawCtx.lineTo(x, y);
  drawCtx.stroke();
  drawCtx.beginPath();
  drawCtx.moveTo(x, y);
}

function endDrawStroke(e) {
  if (!drawIsDrawing || !drawCurrentStroke) return;
  e.preventDefault();
  drawIsDrawing = false;
  drawStrokes.push(drawCurrentStroke);
  drawCurrentStroke = null;
  clearTimeout(drawRecognizeTimer);
  drawRecognizeTimer = setTimeout(recognizeDrawing, HANDWRITING_DELAY_MS);
}

drawCanvas.addEventListener('mousedown', startDrawStroke);
drawCanvas.addEventListener('mousemove', moveDrawStroke);
drawCanvas.addEventListener('mouseup', endDrawStroke);
drawCanvas.addEventListener('mouseleave', endDrawStroke);
drawCanvas.addEventListener('touchstart', startDrawStroke, { passive: false });
drawCanvas.addEventListener('touchmove', moveDrawStroke, { passive: false });
drawCanvas.addEventListener('touchend', endDrawStroke);

async function recognizeDrawing() {
  if (drawStrokes.length === 0) return;

  const ink = drawStrokes.map(s => {
    const t0 = s.ts[0];
    return [
      s.xs.map(Math.round),
      s.ys.map(Math.round),
      s.ts.map(t => t - t0)
    ];
  });

  try {
    const resp = await fetch(
      'https://inputtools.google.com/request?itc=zh-t-i0-handwrit&app=translate',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          options: 'enable_pre_space',
          requests: [{
            writing_guide: {
              writing_area_width: drawCanvas.width,
              writing_area_height: drawCanvas.height
            },
            ink: ink,
            pre_context: '',
            max_num_results: 8,
            max_completions: 0
          }]
        })
      }
    );
    const data = await resp.json();

    if (data[0] === 'SUCCESS' && data[1] && data[1][0]) {
      const chars = data[1][0][1]
        .filter(ch => ch.length === 1 && /[一-鿿㐀-䶿]/.test(ch))
        .slice(0, 8);
      renderDrawCandidates(chars);
    } else {
      drawCandidatesEl.innerHTML = '<span class="draw-candidates-placeholder">no matches</span>';
    }
  } catch {
    drawCandidatesEl.innerHTML = '<span class="draw-candidates-placeholder">error - try serving via HTTP</span>';
  }
}

function renderDrawCandidates(chars) {
  const radicals = resolveToRadicals(chars);
  drawCandidatesEl.innerHTML = '';

  if (radicals.length > 0) {
    for (const r of radicals) {
      const btn = document.createElement('button');
      btn.className = 'draw-candidate-btn';
      btn.textContent = r;
      btn.onclick = () => selectDrawCandidate(r);
      drawCandidatesEl.appendChild(btn);
    }
    return;
  }

  const cjk = chars.filter(ch => /[一-鿿㐀-䶿]/.test(ch)).slice(0, 6);
  if (cjk.length === 0) {
    drawCandidatesEl.innerHTML = '<span class="draw-candidates-placeholder">no matches</span>';
    return;
  }

  const label = document.createElement('span');
  label.className = 'draw-candidates-label';
  label.textContent = 'Not in the 100 - look up in translator:';
  drawCandidatesEl.appendChild(label);

  for (const ch of cjk) {
    const btn = document.createElement('button');
    btn.className = 'draw-candidate-btn lookup';
    btn.textContent = ch;
    btn.title = 'Look up in translator';
    btn.onclick = () => { lookupInTranslator(ch); resetCanvas(); };
    drawCandidatesEl.appendChild(btn);
  }
}

function selectDrawCandidate(ch) {
  filterTable(ch);
  resetCanvas();
}

function resetCanvas() {
  drawStrokes = [];
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  drawCandidatesEl.innerHTML = '<span class="draw-candidates-placeholder">candidates appear here</span>';
  drawHint.style.opacity = '1';
}

function undoDrawStroke() {
  if (drawStrokes.length === 0) return;
  drawStrokes.pop();
  redrawAllStrokes();
  if (drawStrokes.length > 0) {
    clearTimeout(drawRecognizeTimer);
    drawRecognizeTimer = setTimeout(recognizeDrawing, HANDWRITING_DELAY_MS);
  } else {
    drawCandidatesEl.innerHTML = '<span class="draw-candidates-placeholder">candidates appear here</span>';
    drawHint.style.opacity = '1';
  }
}

function clearDrawCanvas() {
  resetCanvas();
  resetFilter();
}

function redrawAllStrokes() {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  for (const s of drawStrokes) {
    drawCtx.beginPath();
    drawCtx.moveTo(s.xs[0], s.ys[0]);
    for (let i = 1; i < s.xs.length; i++) {
      drawCtx.lineTo(s.xs[i], s.ys[i]);
    }
    drawCtx.stroke();
  }
}
</script>
