<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandarin Hub</title>
<meta name="theme-color" content="#1d1d1f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐯</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Crimson+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --rice-paper: #F5F0E8;
  --ink: #1a1a2e;
  --vermillion: #C41E3A;
  --ink-wash: #6B7B8D;
  --warm-highlight: rgba(196, 30, 58, 0.06);
  --active-highlight: rgba(196, 30, 58, 0.10);
  --sidebar-width: 220px;
}

body {
  font-family: 'Crimson Pro', 'PingFang TC', 'Noto Sans TC',
    'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', serif;
  background: var(--rice-paper);
  background-image:
    repeating-linear-gradient(
      0deg, transparent, transparent 40px,
      rgba(184, 134, 11, 0.03) 40px,
      rgba(184, 134, 11, 0.03) 41px
    ),
    repeating-linear-gradient(
      90deg, transparent, transparent 40px,
      rgba(184, 134, 11, 0.03) 40px,
      rgba(184, 134, 11, 0.03) 41px
    );
  color: var(--ink);
  height: 100vh;
  display: flex;
  overflow: hidden;
  animation: pageLoad 0.6s ease-out;
}

@keyframes pageLoad {
  from { opacity: 0; }
  to { opacity: 1; }

}

/* -- Sidebar --------------------------------- */

.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: var(--rice-paper);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  border-right: 1px solid rgba(26, 26, 46, 0.08);
  overflow-y: auto;
  position: relative;
  z-index: 200;
  transition: left 0.3s ease;
}

/* Brand */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 20px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.brand:hover { opacity: 0.75; }

.brand-character {
  font-size: 52px;
  line-height: 1;
}

.brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.3px;
  margin-top: 6px;
}

.brand-subtitle {
  font-family: 'Crimson Pro', serif;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--ink-wash);
  margin-top: 2px;
}

/* Section divider */
.section-divider {
  height: 1px;
  margin: 4px 20px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(26, 26, 46, 0.12) 50%,
    transparent 100%
  );
}

/* Section label */
.section-label {
  font-family: 'Crimson Pro', serif;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--ink-wash);
  padding: 12px 20px 6px;
  user-select: none;
}

/* Nav group */
.nav-group {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 0 8px;
}

/* Nav item */
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border: none;
  background: none;
  cursor: pointer;
  border-radius: 4px;
  border-left: 3px solid transparent;
  font-family: 'Crimson Pro', serif;
  font-size: 14px;
  font-weight: 400;
  color: var(--ink);
  text-align: left;
  width: 100%;
  transition: all 0.15s ease;
  line-height: 1.3;
}

.nav-item:hover {
  background: var(--warm-highlight);
}

.nav-item:hover .nav-icon {
  opacity: 1;
}

.nav-item.active {
  background: var(--active-highlight);
  border-left-color: var(--vermillion);
  font-weight: 600;
}

.nav-item.active .nav-icon {
  opacity: 1;
}

.nav-icon {
  font-size: 16px;
  color: var(--vermillion);
  opacity: 0.6;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
  font-family: "PingFang TC", "Noto Serif TC",
    "Noto Sans TC", "Microsoft YaHei", serif;
  transition: opacity 0.15s ease;
}

.nav-label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Sidebar footer */
.sidebar-footer {
  margin-top: auto;
  padding: 20px 16px 16px;
  display: flex;
  justify-content: center;
  opacity: 0.08;
}

.sidebar-footer svg {
  width: 100%;
  max-width: 180px;
  height: auto;
}

/* -- Content area ---------------------------- */

.content {
  flex: 1;
  position: relative;
  background: #fff;
  margin: 12px 12px 12px 0;
  border-radius: 10px;
  box-shadow:
    inset 0 1px 3px rgba(0, 0, 0, 0.04),
    0 2px 12px rgba(0, 0, 0, 0.06);
  overflow: hidden;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #fff;
}

/* -- Hamburger ------------------------------- */

.hamburger {
  display: none;
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 300;
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 6px;
  background: var(--rice-paper);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
  cursor: pointer;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 0;
}

.hamburger span {
  display: block;
  width: 20px;
  height: 2px;
  background: var(--ink);
  border-radius: 1px;
  transition: all 0.3s ease;
  transform-origin: center;
}

.hamburger.active span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

.hamburger.active span:nth-child(2) {
  opacity: 0;
}

.hamburger.active span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* -- Overlay --------------------------------- */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.3);
  z-index: 150;
  opacity: 0;
  transition: opacity 0.25s ease;
}

.overlay.active {
  display: block;
}

.overlay.visible {
  opacity: 1;
}

/* -- Responsive ------------------------------ */

@media (max-width: 768px) {
  .hamburger {
    display: flex;
  }

  .sidebar {
    position: fixed;
    left: -260px;
    top: 0;
    width: var(--sidebar-width);
    z-index: 200;
    box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
  }

  .sidebar.open {
    left: 0;
  }

  .content {
    width: 100%;
    margin: 0;
    border-radius: 0;
  }
}
</style>
</head>
<body>

<!-- Hamburger (mobile) -->
<button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="sidebar">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Overlay (mobile) -->
<div class="overlay" id="overlay"></div>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">

  <div class="brand" id="brand" role="button" tabindex="0"
       aria-label="Mandarin Hub — go to the Translator">
    <span class="brand-character">&#x1F42F;</span>
    <span class="brand-name">Mandarin Hub</span>
  </div>

  <div class="section-divider"></div>

  <!-- Translate -->
  <div class="section-label">Translate</div>
  <div class="nav-group">
    <button class="nav-item" data-page="mandarin_translation.html">
      <span class="nav-icon">译</span>
      <span class="nav-label">Translator</span>
    </button>
  </div>

  <div class="section-divider"></div>

  <!-- Practice -->
  <div class="section-label">Practice</div>
  <div class="nav-group">
    <button class="nav-item" data-page="mandarin_flashcards.html">
      <span class="nav-icon">闪</span>
      <span class="nav-label">Flashcards</span>
    </button>
    <button class="nav-item" data-page="mandarin_flashcards_2.html">
      <span class="nav-icon">识</span>
      <span class="nav-label">Recall Mode</span>
    </button>
  </div>

  <div class="section-divider"></div>

  <!-- Pronunciation -->
  <div class="section-label">Pronunciation</div>
  <div class="nav-group">
    <button class="nav-item" data-page="pinyin_chart.html">
      <span class="nav-icon">拼</span>
      <span class="nav-label">Pinyin Chart</span>
    </button>
    <button class="nav-item" data-page="pinyin_guide.html">
      <span class="nav-icon">音</span>
      <span class="nav-label">Pinyin Guide</span>
    </button>
  </div>

  <div class="section-divider"></div>

  <!-- Grammar -->
  <div class="section-label">Grammar</div>
  <div class="nav-group">
    <button class="nav-item" data-page="grammar_guide.html">
      <span class="nav-icon">文</span>
      <span class="nav-label">Grammar Guide</span>
    </button>
    <button class="nav-item" data-page="grammar_flashcards.html">
      <span class="nav-icon">练</span>
      <span class="nav-label">Grammar Flashcards</span>
    </button>
  </div>

  <div class="section-divider"></div>

  <!-- Courses -->
  <div class="section-label">Courses</div>
  <div class="nav-group">
    <button class="nav-item" data-page="mandarin_in_14_days.html">
      <span class="nav-icon">课</span>
      <span class="nav-label">14-Day Course</span>
    </button>
  </div>

  <div class="section-divider"></div>

  <!-- Simplified / Traditional -->
  <div class="section-label">Simplified / Traditional</div>
  <div class="nav-group">
    <button class="nav-item" data-page="simplified_to_traditional_guide.html">
      <span class="nav-icon">繁</span>
      <span class="nav-label">S/T Guide</span>
    </button>
    <button class="nav-item" data-page="simplified_to_traditional_cheat_sheet.html">
      <span class="nav-icon">表</span>
      <span class="nav-label">S/T Cheat Sheet</span>
    </button>
    <button class="nav-item" data-page="simplified_traditional_flashcards.html">
      <span class="nav-icon">卡</span>
      <span class="nav-label">S/T Flashcards</span>
    </button>
  </div>

  <!-- Footer with ink wash mountains -->
  <div class="sidebar-footer">
    <svg viewBox="0 0 180 60" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 60 L0 45 Q15 20 30 35 Q40 15 55 30 Q65 10 80 25 Q90 5 105 20 Q115 8 130 22 Q140 12 155 28 Q165 18 180 35 L180 60 Z" fill="#1a1a2e"/>
      <path d="M0 60 L0 50 Q20 30 40 42 Q55 25 70 38 Q85 20 100 33 Q115 22 130 36 Q145 28 160 40 Q170 32 180 42 L180 60 Z" fill="#1a1a2e" opacity="0.5"/>
    </svg>
  </div>

</nav>

<!-- Content -->
<div class="content" id="content"></div>

<script>
const content = document.getElementById('content');
const tabs = document.querySelectorAll('.nav-item');
const iframes = {};
let activePage = null;

const HOME = 'mandarin_translation.html';

function loadPage(page) {
  tabs.forEach(t => {
    const isActive = t.dataset.page === page;
    t.classList.toggle('active', isActive);
    if (isActive) t.setAttribute('aria-current', 'page');
    else t.removeAttribute('aria-current');
  });

  if (activePage && iframes[activePage]) {
    iframes[activePage].style.display = 'none';
  }

  if (!iframes[page]) {
    const f = document.createElement('iframe');
    f.src = page;
    // First load: the iframe isn't ready yet, so focus it once it is -- but only
    // if it's still the page being shown (a slow page must not steal focus later).
    f.addEventListener('load', () => {
      if (activePage === page) f.contentWindow.focus();
    });
    content.appendChild(f);
    iframes[page] = f;
  }

  iframes[page].style.display = 'block';
  activePage = page;
  // Hand keyboard focus to the page so its own shortcuts (space, arrows) reach it.
  iframes[page].contentWindow.focus();
  localStorage.setItem('mandarin-hub-last', page);

  // Close sidebar on mobile
  if (window.innerWidth <= 768) {
    closeSidebar();
  }
}

// Brand click -> HOME
const brand = document.querySelector('.brand');
brand.addEventListener('click', () => loadPage(HOME));
// It's a div, so it needs explicit keyboard activation to match the click.
brand.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    loadPage(HOME);
  }
});

// Tab clicks
tabs.forEach(tab => tab.addEventListener('click', () => loadPage(tab.dataset.page)));

// Mobile menu
const hamburger = document.getElementById('hamburger');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

// Tracks the pending "hide the overlay" timer from closeSidebar(). Without this,
// close-then-reopen inside 250ms lets the stale timer strip .active from an overlay
// that is open again -- the backdrop vanishes and tap-outside-to-close stops working.
let overlayHideTimer = null;

function openSidebar() {
  clearTimeout(overlayHideTimer);
  sidebar.classList.add('open');
  overlay.classList.add('active');
  hamburger.classList.add('active');
  hamburger.setAttribute('aria-expanded', 'true');
  requestAnimationFrame(() => overlay.classList.add('visible'));
}

function closeSidebar() {
  clearTimeout(overlayHideTimer);
  sidebar.classList.remove('open');
  overlay.classList.remove('visible');
  hamburger.classList.remove('active');
  hamburger.setAttribute('aria-expanded', 'false');
  overlayHideTimer = setTimeout(() => overlay.classList.remove('active'), 250);
}

hamburger.addEventListener('click', () => {
  sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
});

overlay.addEventListener('click', closeSidebar);

// Restore last page
const lastPage = localStorage.getItem('mandarin-hub-last');
loadPage(lastPage || HOME);

// Service worker: enables offline use and "Add to Home Screen".
// Needs https:// or localhost -- silently unavailable over file://.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch(err => console.warn('Service worker registration failed:', err));
  });
}
</script>

</body>
</html>
