<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandarin Hub</title>
<meta name="theme-color" content="#1d1d1f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐯</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Crimson+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --rice-paper: #F5F0E8;
  --ink: #1a1a2e;
  --vermillion: #C41E3A;
  --ink-wash: #6B7B8D;
  --warm-highlight: rgba(196, 30, 58, 0.06);
  --active-highlight: rgba(196, 30, 58, 0.10);
  --sidebar-width: 220px;
}

body {
  font-family: 'Crimson Pro', 'PingFang TC', 'Noto Sans TC',
    'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', serif;
  background: var(--rice-paper);
  background-image:
    repeating-linear-gradient(
      0deg, transparent, transparent 40px,
      rgba(184, 134, 11, 0.03) 40px,
      rgba(184, 134, 11, 0.03) 41px
    ),
    repeating-linear-gradient(
      90deg, transparent, transparent 40px,
      rgba(184, 134, 11, 0.03) 40px,
      rgba(184, 134, 11, 0.03) 41px
    );
  color: var(--ink);
  height: 100vh;
  display: flex;
  overflow: hidden;
  animation: pageLoad 0.6s ease-out;
}

@keyframes pageLoad {
  from { opacity: 0; }
  to { opacity: 1; }

}

/* -- Sidebar --------------------------------- */

.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: var(--rice-paper);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  border-right: 1px solid rgba(26, 26, 46, 0.08);
  overflow-y: auto;
  position: relative;
  z-index: 200;
  transition: left 0.3s ease, width 0.3s ease;
}

/* Brand */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 20px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.brand:hover { opacity: 0.75; }

.brand-character {
  font-size: 52px;
  line-height: 1;
}

.brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.3px;
  margin-top: 6px;
}

.brand-subtitle {
  font-family: 'Crimson Pro', serif;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--ink-wash);
  margin-top: 2px;
}

/* Section divider */
.section-divider {
  height: 1px;
  margin: 4px 20px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(26, 26, 46, 0.12) 50%,
    transparent 100%
  );
}

/* Section label */
.section-label {
  font-family: 'Crimson Pro', serif;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--ink-wash);
  padding: 12px 20px 6px;
  user-select: none;
}

/* Nav group */
.nav-group {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 0 8px;
}

/* Nav item */
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 12px;
  border: none;
  background: none;
  cursor: pointer;
  border-radius: 4px;
  border-left: 3px solid transparent;
  font-family: 'Crimson Pro', serif;
  font-size: 14px;
  font-weight: 400;
  color: var(--ink);
  text-align: left;
  width: 100%;
  transition: all 0.15s ease;
  line-height: 1.3;
}

.nav-item:hover {
  background: var(--warm-highlight);
}

.nav-item:hover .nav-icon {
  opacity: 1;
}

.nav-item.active {
  background: var(--active-highlight);
  border-left-color: var(--vermillion);
  font-weight: 600;
}

.nav-item.active .nav-icon {
  opacity: 1;
}

.nav-icon {
  font-size: 16px;
  color: var(--vermillion);
  opacity: 0.6;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
  font-family: "PingFang TC", "Noto Serif TC",
    "Noto Sans TC", "Microsoft YaHei", serif;
  transition: opacity 0.15s ease;
}

.nav-label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Sidebar footer */
.sidebar-footer {
  margin-top: auto;
  padding: 20px 16px 16px;
  display: flex;
  justify-content: center;
  opacity: 0.08;
}

.sidebar-footer svg {
  width: 100%;
  max-width: 180px;
  height: auto;
}

/* Sidebar collapse/expand (desktop) */
.sidebar-collapse {
  position: absolute;
  top: 12px;
  right: 8px;
  width: 24px;
  height: 24px;
  border: none;
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  color: var(--ink-wash);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s, opacity 0.15s;
  z-index: 10;
  opacity: 0;
}

.sidebar:hover .sidebar-collapse,
.sidebar-collapse:focus-visible {
  opacity: 1;
}

.sidebar-collapse:hover {
  background: var(--warm-highlight);
  color: var(--ink);
}

.sidebar-collapse svg {
  width: 14px;
  height: 14px;
}

.sidebar-expand {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 6px;
  background: var(--rice-paper);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
  cursor: pointer;
  color: var(--ink-wash);
  align-items: center;
  justify-content: center;
  z-index: 300;
  transition: color 0.15s;
}

.sidebar-expand:hover {
  color: var(--ink);
}

.sidebar-expand svg {
  width: 14px;
  height: 14px;
}

@media (min-width: 769px) {
  .sidebar.collapsed {
    width: 0;
    min-width: 0;
    overflow: hidden;
    border-right-color: transparent;
  }

  .sidebar.collapsed ~ .sidebar-expand {
    display: flex;
  }

  .sidebar.collapsed ~ .content {
    margin-left: 56px;
  }
}

/* -- Content area ---------------------------- */

.content {
  flex: 1;
  position: relative;
  background: #fff;
  margin: 12px 12px 12px 0;
  border-radius: 10px;
  box-shadow:
    inset 0 1px 3px rgba(0, 0, 0, 0.04),
    0 2px 12px rgba(0, 0, 0, 0.06);
  overflow: hidden;
  transition: margin 0.3s ease;
}

iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  background: #fff;
  visibility: hidden;
  pointer-events: none;
}

/* -- Study timer badge ----------------------- */

.study-badge {
  position: fixed;
  top: 12px;
  right: 16px;
  z-index: 400;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--vermillion);
  color: #fff;
  font-family: 'Crimson Pro', serif;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(196, 30, 58, 0.3);
  transition: transform 0.15s, box-shadow 0.15s;
  user-select: none;
}

.study-badge:hover {
  transform: scale(1.1);
  box-shadow: 0 3px 12px rgba(196, 30, 58, 0.4);
}

.study-panel {
  display: none;
  position: fixed;
  top: 56px;
  right: 16px;
  z-index: 400;
  width: 240px;
  max-height: 420px;
  background: var(--rice-paper);
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  overflow: hidden;
  animation: panelSlide 0.15s ease-out;
}

.study-panel.open { display: block; }

@keyframes panelSlide {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.study-panel-header {
  padding: 12px 14px 8px;
  font-family: 'Crimson Pro', serif;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--ink-wash);
}

.study-panel-list {
  overflow-y: auto;
  max-height: 370px;
  padding: 0 14px 12px;
}

.study-panel-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 0;
  font-family: 'Crimson Pro', serif;
  font-size: 13px;
  color: var(--ink);
  border-bottom: 1px solid rgba(26, 26, 46, 0.05);
}

.study-panel-row:last-child { border-bottom: none; }

.study-panel-row .day-label {
  color: var(--ink-wash);
  font-size: 12px;
}

.study-panel-row .day-minutes {
  font-weight: 600;
  font-size: 13px;
}

.study-panel-row.today {
  color: var(--vermillion);
}

.study-panel-row.today .day-label {
  color: var(--vermillion);
}

/* -- Hamburger ------------------------------- */

.hamburger {
  display: none;
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 300;
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 6px;
  background: var(--rice-paper);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
  cursor: pointer;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 0;
}

.hamburger span {
  display: block;
  width: 20px;
  height: 2px;
  background: var(--ink);
  border-radius: 1px;
  transition: all 0.3s ease;
  transform-origin: center;
}

.hamburger.active span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

.hamburger.active span:nth-child(2) {
  opacity: 0;
}

.hamburger.active span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* -- Overlay --------------------------------- */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.3);
  z-index: 150;
  opacity: 0;
  transition: opacity 0.25s ease;
}

.overlay.active {
  display: block;
}

.overlay.visible {
  opacity: 1;
}

/* -- Responsive ------------------------------ */

@media (max-width: 768px) {
  .sidebar-collapse {
    display: none;
  }

  .hamburger {
    display: flex;
  }

  .sidebar {
    position: fixed;
    left: -260px;
    top: 0;
    width: var(--sidebar-width);
    z-index: 200;
    box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
  }

  .sidebar.open {
    left: 0;
  }

  .content {
    width: 100%;
    margin: 0;
    border-radius: 0;
  }
}
</style>
</head>

<script>
const content = document.getElementById('content');
const tabs = document.querySelectorAll('.nav-item');
const iframes = {};
const scrollPositions = {};
let activePage = null;

const HOME = 'mandarin_translation.html';

// Whitelist of loadable pages. Everything that can set the iframe src -- the
// URL hash, localStorage -- is checked against this. Without it, a crafted
// #https://example.com would make the hub frame an arbitrary external site.
const KNOWN_PAGES = new Set([HOME, ...[...tabs].map(t => t.dataset.page)]);

function isKnownPage(page) {
  return typeof page === 'string' && KNOWN_PAGES.has(page);
}

// Hash routing (not pushState): GitHub Pages has no rewrite rules, so a real
// path would 404 on refresh. A hash also survives being opened from file://.
function pageFromHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
  return isKnownPage(raw) ? raw : null;
}

function loadPage(page, updateHash = true) {
  if (!isKnownPage(page)) page = HOME;

  // Writing the hash re-enters via hashchange; that call passes updateHash=false.
  if (updateHash && pageFromHash() !== page) {
    location.hash = page;
    return;   // hashchange will call back in with the real work
  }

  tabs.forEach(t => {
    const isActive = t.dataset.page === page;
    t.classList.toggle('active', isActive);
    if (isActive) t.setAttribute('aria-current', 'page');
    else t.removeAttribute('aria-current');
  });

  if (activePage && iframes[activePage]) {
    // display:none does not stop timers or audio, and pages are never unloaded,
    // so a running deck would keep advancing and speaking from a hidden iframe.
    // postMessage rather than reaching into contentDocument, so this still works
    // over file://, where the frames are cross-origin. '*' for the same reason
    // (file:// origins are opaque); the message carries nothing sensitive.
    try {
      scrollPositions[activePage] = iframes[activePage].contentWindow.scrollY;
    } catch (e) { /* cross-origin on file:// - use postMessage fallback */ }
    try {
      iframes[activePage].contentWindow.postMessage({ type: 'mandarin-hub:hidden' }, '*');
    } catch (e) { /* frame not ready yet */ }
    iframes[activePage].style.visibility = 'hidden';
    iframes[activePage].style.pointerEvents = 'none';
  }

  if (!iframes[page]) {
    const f = document.createElement('iframe');
    if (pendingLookup && page === 'mandarin_translation.html') {
      f.src = page + '?lookup=' + encodeURIComponent(pendingLookup);
      pendingLookup = null;
    } else if (pendingStrokeOrder && page === 'mandarin_translation.html') {
      f.src = page + '?stroke=' + encodeURIComponent(pendingStrokeOrder);
      pendingStrokeOrder = null;
    } else if (pendingAnchor && pendingAnchor.page === page) {
      f.src = page + '#' + pendingAnchor.anchor;
      pendingAnchor = null;
    } else {
      f.src = page;
    }
    // First load: the iframe isn't ready yet, so focus it once it is -- but only
    // if it's still the page being shown (a slow page must not steal focus later).
    f.addEventListener('load', () => {
      if (activePage === page) f.contentWindow.focus();
    });
    content.appendChild(f);
    iframes[page] = f;
  }

  iframes[page].style.visibility = 'visible';
  iframes[page].style.pointerEvents = 'auto';
  activePage = page;
  const savedY = scrollPositions[page];
  if (savedY != null) {
    requestAnimationFrame(() => {
      try {
        iframes[page].contentWindow.scrollTo(0, savedY);
      } catch (e) { /* cross-origin on file:// */ }
    });
  }
  try {
    const msg = { type: 'mandarin-hub:visible' };
    if (savedY != null) msg.scrollY = savedY;
    if (pendingStrokeOrder && page === 'mandarin_translation.html') {
      msg.strokeOrder = pendingStrokeOrder;
      pendingStrokeOrder = null;
    }
    iframes[page].contentWindow.postMessage(msg, '*');
  } catch (e) { /* frame not ready yet */ }
  // Hand keyboard focus to the page so its own shortcuts (space, arrows) reach it.
  iframes[page].contentWindow.focus();
  localStorage.setItem('mandarin-hub-last', page);

  // Close sidebar on mobile
  if (window.innerWidth <= 768) {
    closeSidebar();
  }
}

// Brand click -> HOME
const brand = document.querySelector('.brand');
brand.addEventListener('click', () => loadPage(HOME));
// It's a div, so it needs explicit keyboard activation to match the click.
brand.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    loadPage(HOME);
  }
});

// Tab clicks
tabs.forEach(tab => tab.addEventListener('click', () => loadPage(tab.dataset.page)));

// Mobile menu
const hamburger = document.getElementById('hamburger');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

// Tracks the pending "hide the overlay" timer from closeSidebar(). Without this,
// close-then-reopen inside 250ms lets the stale timer strip .active from an overlay
// that is open again -- the backdrop vanishes and tap-outside-to-close stops working.
let overlayHideTimer = null;

function openSidebar() {
  clearTimeout(overlayHideTimer);
  sidebar.classList.add('open');
  overlay.classList.add('active');
  hamburger.classList.add('active');
  hamburger.setAttribute('aria-expanded', 'true');
  requestAnimationFrame(() => overlay.classList.add('visible'));
}

function closeSidebar() {
  clearTimeout(overlayHideTimer);
  sidebar.classList.remove('open');
  overlay.classList.remove('visible');
  hamburger.classList.remove('active');
  hamburger.setAttribute('aria-expanded', 'false');
  overlayHideTimer = setTimeout(() => overlay.classList.remove('active'), 250);
}

hamburger.addEventListener('click', () => {
  sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
});

overlay.addEventListener('click', closeSidebar);

// Desktop sidebar collapse
const sidebarCollapse = document.getElementById('sidebar-collapse');
const sidebarExpand = document.getElementById('sidebar-expand');

sidebarCollapse.addEventListener('click', () => {
  sidebar.classList.add('collapsed');
  localStorage.setItem('mandarin-hub-sidebar-collapsed', 'true');
});

sidebarExpand.addEventListener('click', () => {
  sidebar.classList.remove('collapsed');
  localStorage.removeItem('mandarin-hub-sidebar-collapsed');
});

if (localStorage.getItem('mandarin-hub-sidebar-collapsed') === 'true'
    && window.innerWidth > 768) {
  sidebar.style.transition = 'none';
  sidebar.classList.add('collapsed');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { sidebar.style.transition = ''; });
  });
}

// Child pages can request navigation (e.g. phrase_reference lookup button).
// Existing iframe: postMessage (instant, no reload, no history entry).
// First load: bake ?lookup= into the iframe src so it auto-translates on init.
let pendingLookup = null;
let pendingStrokeOrder = null;
let pendingAnchor = null;
window.addEventListener('message', (e) => {
  if (!e.data) return;
  if (e.data.type === 'mandarin-hub:scroll-report') {
    for (const [page, frame] of Object.entries(iframes)) {
      if (e.source === frame.contentWindow) {
        scrollPositions[page] = e.data.scrollY;
        break;
      }
    }
    return;
  }
  if (e.data.type === 'mandarin-hub:lookup') {
    const target = 'mandarin_translation.html';
    const query = e.data.query;
    if (iframes[target]) {
      loadPage(target);
      try {
        iframes[target].contentWindow.postMessage({
          type: 'mandarin-hub:lookup-query', query: query
        }, '*');
      } catch (err) { /* frame not ready */ }
    } else {
      pendingLookup = query;
      loadPage(target);
    }
  }
  if (e.data.type === 'mandarin-hub:stroke-order') {
    pendingStrokeOrder = e.data.char;
    loadPage('mandarin_translation.html');
  }
  if (e.data.type === 'mandarin-hub:navigate') {
    const full = e.data.page || '';
    const [page, hash] = full.split('#');
    if (!isKnownPage(page)) return;
    if (hash) {
      if (iframes[page]) {
        loadPage(page);
        try {
          iframes[page].contentWindow.postMessage({
            type: 'mandarin-hub:scroll-to-anchor', anchor: hash
          }, '*');
        } catch (err) { /* frame not ready */ }
      } else {
        pendingAnchor = { page, anchor: hash };
        loadPage(page);
      }
    } else {
      loadPage(page);
    }
  }
});

// Back/forward and hand-edited or shared URLs.
window.addEventListener('hashchange', () => {
  loadPage(pageFromHash() || HOME, false);
});

// Opening order: an explicit URL hash wins, then the last page you were on.
const stored = localStorage.getItem('mandarin-hub-last');
const initial = pageFromHash() || (isKnownPage(stored) ? stored : HOME);
loadPage(initial);

// Service worker: enables offline use and "Add to Home Screen".
// Needs https:// or localhost -- silently unavailable over file://.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch(err => console.warn('Service worker registration failed:', err));
  });
}

// -- Study time tracker -------------------------------------------------------
// Counts active minutes per day. "Active" = user interacted within the last
// IDLE_TIMEOUT_MS. Pauses when the tab is hidden.

(function() {
  const STORAGE_KEY = 'mandarin-hub-study-log';
  const IDLE_TIMEOUT_MS = 2 * 60 * 1000;
  const TICK_MS = 1000;

  const badge = document.getElementById('study-badge');
  const panel = document.getElementById('study-panel');
  const panelList = document.getElementById('study-panel-list');

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-'
      + String(d.getMonth() + 1).padStart(2, '0') + '-'
      + String(d.getDate()).padStart(2, '0');
  }

  function loadLog() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }

  function saveLog(log) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
  }

  function pruneLog(log) {
    const keys = Object.keys(log).sort();
    while (keys.length > 60) {
      delete log[keys.shift()];
    }
    return log;
  }

  let lastActivity = Date.now();
  let tabVisible = !document.hidden;
  let activeSeconds = 0;

  // Restore today's seconds from the log
  const log = loadLog();
  activeSeconds = log[todayKey()] || 0;
  updateBadge();

  function isActive() {
    return tabVisible && (Date.now() - lastActivity < IDLE_TIMEOUT_MS);
  }

  function updateBadge() {
    badge.textContent = Math.floor(activeSeconds / 60);
  }

  function persist() {
    const log = loadLog();
    log[todayKey()] = activeSeconds;
    saveLog(pruneLog(log));
  }

  // Tick every second; only increment when active
  let lastTick = Date.now();
  setInterval(() => {
    const now = Date.now();
    if (isActive()) {
      // Use wall-clock delta so we don't lose time if the tab was throttled
      const elapsed = Math.round((now - lastTick) / 1000);
      activeSeconds += Math.min(elapsed, 5);
      updateBadge();
    }
    lastTick = now;
  }, TICK_MS);

  // Persist every 30 seconds so we don't lose much if the tab is closed
  setInterval(persist, 30000);

  // Also persist on page hide (closing tab, navigating away)
  window.addEventListener('pagehide', persist);

  // Day rollover: if the date changed since last tick, reset
  let currentDay = todayKey();
  setInterval(() => {
    const day = todayKey();
    if (day !== currentDay) {
      persist();
      currentDay = day;
      activeSeconds = 0;
      updateBadge();
    }
  }, 10000);

  // Activity listeners -- hub level
  function markActive() { lastActivity = Date.now(); }
  document.addEventListener('mousemove', markActive, { passive: true });
  document.addEventListener('keydown', markActive, { passive: true });
  document.addEventListener('scroll', markActive, { passive: true });
  document.addEventListener('click', markActive, { passive: true });
  document.addEventListener('touchstart', markActive, { passive: true });

  // Any postMessage from an iframe is evidence of user interaction (scroll
  // reports, lookups, navigation requests, etc.)
  window.addEventListener('message', (e) => {
    if (e.data && typeof e.data.type === 'string'
        && e.data.type.startsWith('mandarin-hub:')) {
      markActive();
    }
  });

  // Detect mouse presence over the iframe area: every 3 seconds, briefly
  // show a transparent overlay that captures one mousemove, then hide it
  // so clicks pass through. This works across origins without touching
  // any child page.
  const probe = document.createElement('div');
  probe.style.cssText =
    'position:absolute;inset:0;z-index:1;opacity:0;cursor:inherit;display:none';
  content.style.position = 'relative';
  content.appendChild(probe);

  setInterval(() => {
    if (!tabVisible) return;
    probe.style.display = 'block';
    const hide = () => {
      markActive();
      probe.style.display = 'none';
      probe.removeEventListener('mousemove', hide);
      probe.removeEventListener('touchstart', hide);
    };
    probe.addEventListener('mousemove', hide, { once: true });
    probe.addEventListener('touchstart', hide, { once: true });
    // Auto-hide after a short window so clicks aren't blocked
    setTimeout(() => { probe.style.display = 'none'; }, 200);
  }, 3000);

  // Iframe focus (user clicked into it)
  window.addEventListener('blur', () => {
    if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
      markActive();
    }
  });
  window.addEventListener('focus', markActive);

  // Visibility change
  document.addEventListener('visibilitychange', () => {
    tabVisible = !document.hidden;
    if (tabVisible) {
      lastTick = Date.now();
      markActive();
      // Day might have changed while hidden
      const day = todayKey();
      if (day !== currentDay) {
        persist();
        currentDay = day;
        activeSeconds = 0;
        updateBadge();
      }
    } else {
      persist();
    }
  });

  // Panel toggle
  badge.addEventListener('click', (e) => {
    e.stopPropagation();
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) renderPanel();
  });

  document.addEventListener('click', (e) => {
    if (!panel.contains(e.target) && e.target !== badge) {
      panel.classList.remove('open');
    }
  });

  function renderPanel() {
    persist();
    const log = loadLog();
    const days = [];
    const now = new Date();
    for (let i = 0; i < 60; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const key = d.getFullYear() + '-'
        + String(d.getMonth() + 1).padStart(2, '0') + '-'
        + String(d.getDate()).padStart(2, '0');
      const secs = log[key] || 0;
      const mins = Math.floor(secs / 60);
      const label = i === 0 ? 'Today'
        : i === 1 ? 'Yesterday'
        : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      days.push({ label, mins, isToday: i === 0 });
    }

    panelList.innerHTML = days
      .filter(d => d.mins > 0 || d.isToday)
      .map(d =>
        `<div class="study-panel-row${d.isToday ? ' today' : ''}">` +
          `<span class="day-label">${d.label}</span>` +
          `<span class="day-minutes">${d.mins}m</span>` +
        `</div>`
      ).join('') || '<div class="study-panel-row"><span class="day-label">No activity yet</span></div>';
  }
})();
</script>

</body>
