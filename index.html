<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1d1d1f">
<title>Chinese Translator</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .container {
    max-width: 900px;
    width: 100%;
  }

  .offline-banner {
    display: none;
    background: #ff9500;
    color: #fff;
    text-align: center;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .columns {
    display: flex;
    gap: 24px;
    justify-content: center;
    align-items: flex-start;
  }

  .column {
    flex: 1;
    max-width: 260px;
    text-align: center;
  }

  .column-label {
    font-size: 13px;
    font-weight: 600;
    color: #86868b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px 16px;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: box-shadow 0.2s;
  }

  .card:hover {
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  }

  .card-input {
    cursor: text;
  }

  #english-input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 20px;
    text-align: center;
    background: transparent;
    color: #1d1d1f;
    font-family: inherit;
  }

  #english-input::placeholder {
    color: #c7c7cc;
  }

  .chinese-text {
    font-size: 40px;
    line-height: 1.3;
    min-height: 52px;
    color: #1d1d1f;
  }

  .pinyin {
    font-size: 14px;
    color: #34c759;
    margin-top: 10px;
    min-height: 20px;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: color 0.2s;
  }

  .pinyin:hover {
    color: #248a3d;
  }

  .breakdown {
    margin-top: 40px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px 28px;
    display: none;
  }

  .breakdown-title {
    font-size: 13px;
    font-weight: 600;
    color: #86868b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
  }

  .breakdown-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f2;
    font-size: 16px;
  }

  .breakdown-item:last-child {
    border-bottom: none;
  }

  .breakdown-char {
    font-size: 28px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .breakdown-arrow {
    color: #86868b;
    font-size: 20px;
  }

  .breakdown-pinyin {
    color: #1d1d1f;
    font-size: 14px;
    margin-left: 4px;
  }

  .breakdown-meaning {
    color: #515154;
  }

  .components {
    margin-left: 40px;
    padding: 8px 0 4px;
  }

  .component-item {
    font-size: 14px;
    color: #515154;
    padding: 4px 0;
  }

  .component-char {
    font-size: 22px;
  }

  .component-arrow {
    color: #86868b;
  }

  .component-meaning {
    color: #86868b;
  }

  .loading {
    color: #86868b;
    font-size: 14px;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  @media (max-width: 700px) {
    .columns { flex-direction: column; align-items: center; }
    .column { max-width: 100%; width: 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="offline-banner" id="offline-banner">Offline - translation requires internet</div>
  <div class="columns">
    <div class="column">
      <div class="column-label">English</div>
      <form id="translate-form" class="card card-input" onclick="document.getElementById('english-input').focus()">
        <input type="text" id="english-input" placeholder="Type a word..." autofocus enterkeyhint="search">
      </form>
    </div>
    <div class="column">
      <div class="column-label">Traditional</div>
      <div class="card">
        <div class="chinese-text" id="traditional-text"></div>
      </div>
      <div class="pinyin" id="traditional-pinyin"></div>
    </div>
    <div class="column">
      <div class="column-label">Simplified</div>
      <div class="card">
        <div class="chinese-text" id="simplified-text"></div>
      </div>
      <div class="pinyin" id="simplified-pinyin"></div>
    </div>
  </div>
  <div class="breakdown" id="breakdown">
    <div class="breakdown-title">Character Breakdown</div>
    <div id="breakdown-content"></div>
  </div>
</div>

<script>

  '記': { components: [['言','讠','speech, words'],['己','己','self']], type: 'lr' },

  '設': { components: [['言','讠','speech, words'],['殳','殳','weapon']], type: 'lr' },

  '課': { components: [['言','讠','speech, words'],['果','果','fruit']], type: 'lr' },

  '論': { components: [['言','讠','speech, words'],['侖','仑','logical']], type: 'lr' },
  '議': { components: [['言','讠','speech, words'],['義','义','righteousness']], type: 'lr' },
  '頭': { components: [['豆','豆','bean'],['頁','页','page, head']], type: 'lr' },
  '髮': { components: [['髟','髟','long hair'],['犮','犮','remove']], type: 'tb' },
  '門': { components: [['門','门','gate']], type: 'single' },
  '開': { components: [['門','门','gate'],['开','开','open']], type: 'tb' },
  '關': { components: [['門','门','gate'],['丱','丱','young']], type: 'surround' },
  '閱': { components: [['門','门','gate'],['兌','兑','exchange']], type: 'surround' },
  '間': { components: [['門','门','gate'],['日','日','sun']], type: 'surround' },
  '問': { components: [['門','门','gate'],['口','口','mouth']], type: 'surround' },
  '聞': { components: [['門','门','gate'],['耳','耳','ear']], type: 'surround' },
  '車': { components: [['車','车','vehicle']], type: 'single' },
  '馬': { components: [['馬','马','horse']], type: 'single' },
  '魚': { components: [['魚','鱼','fish']], type: 'single' },
  '鳥': { components: [['鳥','鸟','bird']], type: 'single' },
  '龍': { components: [['龍','龙','dragon']], type: 'single' },
  '風': { components: [['風','风','wind']], type: 'single' },
  '飛': { components: [['飛','飞','fly']], type: 'single' },
  '見': { components: [['見','见','see']], type: 'single' },
  '貝': { components: [['貝','贝','shell, money']], type: 'single' },
  '長': { components: [['長','长','long']], type: 'single' },
  '東': { components: [['東','东','east']], type: 'single' },

  '學': { components: [['學','学','study']], type: 'single' },
  '國': { components: [['囗','囗','enclosure'],['或','或','or, nation']], type: 'surround' },
  '電': { components: [['雨','雨','rain'],['电','电','electric']], type: 'tb' },
  '時': { components: [['日','日','sun, time'],['寺','寺','temple']], type: 'lr' },
  '會': { components: [['會','会','meet, able']], type: 'single' },
  '實': { components: [['宀','宀','roof'],['貫','贯','pierce']], type: 'tb' },
  '體': { components: [['骨','骨','bone'],['豊','丰','abundant']], type: 'lr' },
  '廣': { components: [['广','广','cliff, wide'],['黃','黄','yellow']], type: 'surround' },

  '過': { components: [['辶','辶','walk'],['咼','呙','mouth, slant']], type: 'surround' },
  '對': { components: [['對','对','correct, pair']], type: 'single' },
  '從': { components: [['從','从','follow']], type: 'single' },
  '們': { components: [['亻','亻','person'],['門','门','gate']], type: 'lr' },
  '這': { components: [['辶','辶','walk'],['言','言','speech']], type: 'surround' },
  '無': { components: [['無','无','without']], type: 'single' },
  '還': { components: [['辶','辶','walk'],['睘','睘','stare']], type: 'surround' },
  '環': { components: [['王','王','jade'],['睘','睘','surround']], type: 'lr' },
  '愛': { components: [['爫','爫','claw'],['冖','冖','cover'],['心','心','heart'],['夂','夂','go']], type: 'tb' },
  '飯': { components: [['食','饣','eat, food'],['反','反','reverse']], type: 'lr' },
  '銀': { components: [['金','钅','metal'],['艮','艮','tough']], type: 'lr' },
  '鐵': { components: [['金','钅','metal'],['鉄','铁','iron']], type: 'lr' },
  '錢': { components: [['金','钅','metal'],['戔','戋','small']], type: 'lr' },
  '紅': { components: [['糹','纟','silk, thread'],['工','工','work']], type: 'lr' },
  '給': { components: [['糹','纟','silk, thread'],['合','合','combine']], type: 'lr' },
  '線': { components: [['糹','纟','silk, thread'],['泉','泉','spring']], type: 'lr' },
  '經': { components: [['糹','纟','silk, thread'],['巠','巠','stream']], type: 'lr' },
  '紙': { components: [['糹','纟','silk, thread'],['氏','氏','clan']], type: 'lr' },
  '買': { components: [['買','买','buy']], type: 'single' },
  '賣': { components: [['賣','卖','sell']], type: 'single' },
  '貓': { components: [['豸','豸','beast'],['苗','苗','sprout']], type: 'lr' },
  '機': { components: [['木','木','tree'],['幾','几','how many']], type: 'lr' },
  '雞': { components: [['奚','奚','where'],['隹','隹','short-tailed bird']], type: 'lr' },
  '漢': { components: [['氵','氵','water'],['廿','廿','twenty'],['中','中','middle'],['口','口','mouth']], type: 'lr' },
  '寫': { components: [['宀','宀','roof'],['舄','舄','shoe']], type: 'tb' },
  '華': { components: [['華','华','magnificent, China']], type: 'single' },
  '麵': { components: [['麥','麦','wheat'],['面','面','face, surface']], type: 'lr' },
  '麥': { components: [['麥','麦','wheat']], type: 'single' },
};

function isChinese(text) {
  return /[一-鿿㐀-䶿]/.test(text);
}

async function googleTranslate(text, sourceLang, targetLang) {
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
  const resp = await fetch(url);
  const data = await resp.json();
  return data[0].map(s => s[0]).join('');
}

function getPinyin(chinese) {
  if (typeof pinyinPro === 'undefined') return '';
  return pinyinPro.pinyin(chinese, { toneType: 'num', type: 'array' }).join(' ');
}

function speak(chinese) {
  const utterance = new SpeechSynthesisUtterance(chinese);
  utterance.lang = 'zh-CN';
  utterance.rate = 0.8;
  speechSynthesis.speak(utterance);
}

async function getCharMeaning(char) {
  try {
    const result = await googleTranslate(char, 'zh-CN', 'en');
    return result.toLowerCase();
  } catch {
    return '';
  }
}

async function translate() {
  const input = document.getElementById('english-input').value.trim();
  if (!input) return;

  const tradEl = document.getElementById('traditional-text');
  const simpEl = document.getElementById('simplified-text');
  const tradPinEl = document.getElementById('traditional-pinyin');
  const simpPinEl = document.getElementById('simplified-pinyin');
  const breakdownEl = document.getElementById('breakdown');
  const breakdownContent = document.getElementById('breakdown-content');

  tradEl.innerHTML = '<span class="loading">...</span>';
  simpEl.innerHTML = '<span class="loading">...</span>';
  tradPinEl.textContent = '';
  simpPinEl.textContent = '';
  breakdownEl.style.display = 'none';
  breakdownContent.innerHTML = '';

  try {
    let traditional, simplified, english;

    if (isChinese(input)) {
      const asSimplified = await googleTranslate(input, 'zh-TW', 'zh-CN');
      const asTraditional = await googleTranslate(input, 'zh-CN', 'zh-TW');

      if (asSimplified === input || input === asTraditional) {
        traditional = asTraditional === input ? input : asTraditional;
        simplified = asSimplified;
      } else {
        traditional = asTraditional;
        simplified = asSimplified;
      }

      english = await googleTranslate(input, 'auto', 'en');
      document.getElementById('english-input').value = english.toLowerCase();
    } else {
      english = input;
      traditional = await googleTranslate(input, 'en', 'zh-TW');
      simplified = await googleTranslate(traditional, 'zh-TW', 'zh-CN');
    }

    tradEl.textContent = traditional;
    simpEl.textContent = simplified;

    tradPinEl.textContent = getPinyin(traditional);
    tradPinEl.onclick = () => speak(traditional);
    simpPinEl.textContent = getPinyin(simplified);
    simpPinEl.onclick = () => speak(simplified);

    await buildBreakdown(traditional, simplified, breakdownContent);
    breakdownEl.style.display = 'block';

  } catch (err) {
    tradEl.textContent = '';
    simpEl.textContent = '';
    console.error('Translation error:', err);
  }
}

async function buildBreakdown(traditional, simplified, container) {
  const tradChars = [...traditional];
  const simpChars = [...simplified];
  const isSingleChar = tradChars.length === 1;

  for (let i = 0; i < tradChars.length; i++) {
    const tc = tradChars[i];
    const sc = simpChars[i] || tc;
    const pinyin = getPinyin(sc);
    const meaning = await getCharMeaning(sc);
    const isDifferent = tc !== sc;

    const item = document.createElement('div');
    item.className = 'breakdown-item';

    let charDisplay;
    if (isDifferent) {
      charDisplay = `<span class="breakdown-char">${tc} <span class="breakdown-arrow">&rarr;</span> ${sc}</span>`;
    } else {
      charDisplay = `<span class="breakdown-char">${tc}</span>`;
    }

    item.innerHTML = `
      ${charDisplay}
      <span class="breakdown-pinyin">${pinyin}</span>
      <span class="breakdown-meaning">= ${meaning}</span>
    `;
    container.appendChild(item);

    if (isSingleChar && DECOMPOSITION[tc]) {
      const decomp = DECOMPOSITION[tc];
      const compDiv = document.createElement('div');
      compDiv.className = 'components';

      for (const [tradComp, simpComp, compMeaning] of decomp.components) {
        const compItem = document.createElement('div');
        compItem.className = 'component-item';

        if (tradComp !== simpComp) {
          compItem.innerHTML = `
            <span class="component-char">${tradComp}</span>
            <span class="component-arrow">&rarr;</span>
            <span class="component-char">${simpComp}</span>
            <span class="component-meaning">= ${compMeaning}</span>
          `;
        } else {
          compItem.innerHTML = `
            <span class="component-char">${tradComp}</span>
            <span class="component-meaning">= ${compMeaning}</span>
          `;
        }
        compDiv.appendChild(compItem);
      }
      container.appendChild(compDiv);
    }
  }
}

document.getElementById('translate-form').addEventListener('submit', (e) => {
  e.preventDefault();
  translate();
});

document.getElementById('english-input').addEventListener('change', () => {
  translate();
});

window.addEventListener('online', () => {
  document.getElementById('offline-banner').style.display = 'none';
});
window.addEventListener('offline', () => {
  document.getElementById('offline-banner').style.display = 'block';
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>

</html>
