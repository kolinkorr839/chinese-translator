<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<p>Right-click each image and "Save Image As" with the filename shown:</p>
<div id="icons"></div>
<script>
function makeIcon(size, filename) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  const r = size * 0.18;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();

  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#1d1d1f');
  grad.addColorStop(1, '#3a3a3c');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${size * 0.5}px -apple-system, sans-serif`;
  ctx.fillText('中', size / 2, size / 2 + size * 0.02);

  const img = new Image();
  img.src = canvas.toDataURL('image/png');
  img.style.margin = '10px';

  const container = document.getElementById('icons');
  const label = document.createElement('p');
  label.textContent = `${filename} (${size}x${size}):`;
  container.appendChild(label);
  container.appendChild(img);
}

makeIcon(192, 'icon-192.png');
makeIcon(512, 'icon-512.png');
makeIcon(180, 'apple-touch-icon.png');
</script>
</body>
</html>
